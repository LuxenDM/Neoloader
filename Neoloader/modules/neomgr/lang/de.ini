44=Verwenden Sie diese Option nur, wenn Neoloader nicht richtig funktioniert oder Sie ihn entfernen möchten. Bei der Deinstallation wird die gespeicherte Konfiguration von Neoloader gelöscht und das automatische Laden verhindert, wodurch Neoloader deaktiviert wird. Anschließend können Sie entweder seine Dateien entfernen oder später den Befehl /neo verwenden, um ihn wieder zu aktivieren.
45=WARNUNG! Wählen Sie neomgr als Ihre LME-Oberfläche aus, bevor Sie Einstellungen ändern, die eine Authentifizierung erfordern.
