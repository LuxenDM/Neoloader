#Turkish
0=Türkçe
1=Lexicon, diğer eklentilerin dizinlenmiş bir sözlük kütüphanesi aracılığıyla diğer diller için çeviriler sağlamasını kolaylaştırır.
2=Lexicon çeviri sözlük kütüphanesi
3=Bir çeviri yüklendiğinde tüm girdileri önbelleğe al ve kaydet
4=Mümkün olduğunda oyun dilini tercih ettiğiniz dille eşleştir
5=birincil dil
6=ikincil dil
7=Desteklendiğinde önce birincil dil kullanılacaktır. İkincil dil bir yedektir.
8=Bu dil eski bir çeviri kitabı tarafından eklendi. Modlar arası destek muhtemelen çok sınırlıdır.
9=Bu dil bir mod tarafından eklendi. Diğer modlardaki destek değişebilir.
10=Bu dil Lexicon tarafından sağlanmaktadır.
11=Oyun bu dili yerel olarak desteklemektedir.
12=Bu dil bu dosyadan eklendi
13=Bu dil bir mod tarafından desteklenmiyorsa, aşağıdaki otomatik olarak kullanılacaktır
14=Birincil veya yedek dilinizi ayarlayıp ayarlamadığınızı seçin
15=mevcut tercih edilen dil
16=mevcut ikincil seçim
17=Seçmek için aşağıdaki bir dile tıklayın.
18=Kapat
19=Lexicon dil seçici
20=Geçersiz yazı tipi karakterlerinin transliterasyonunu yap
