[recovery]
init_failure={init_failure}

[init_failure]
local_dir_find_failure=Neoloader was unable to determine its own location. Because of that, it cannot run any of its submodules safely, or any LME mods. Fix: try reinstalling Neoloader. Check for updates.|reinstall|update|post
recovery_not_found=Neoloader was unable to find the code for its recovery environment; this is a core module for handling problems during Neoloader's initialization. Fix: try reinstalling Neoloader. Check for updates.|reinstall|update|post
recovery_load_error=Neoloader was unable to create its recovery environment; this is a core module and a failure indicates a significant change to Vendetta Online. Fix: Check Neoloader for updates.|update|post