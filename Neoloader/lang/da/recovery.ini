[recovery]
RECOV_MISSING_CORE_FILES=Neoloader har fundet en kritisk fejl og kan ikke starte!\nNoedvendige filer for Neoloader blev ikke fundet.\nManglende filer:
RECOV_FS_MISSING_MODULE=Neoloader kunne ikke finde et noedvendigt modul
RECOV_FS_FAILED_MODULE=Neoloader kunne ikke indlaese et noedvendigt modul
RECOV_RUN=Koer denne handling
RECOV_RUN_FAIL=Handling fejlede: 
RECOV_USER_ACCESS_NOTIF=Recovery aabnet af bruger

RECOV_PREAMBLE=Fejl fanget af recovery
RECOV_PREAMBLE_EMPTY=Recovery har ikke fanget nogen direkte fejl.
RECOV_FULL_LOG=Fuld Neoloader-log

RECOVERY_HOME_TITLE=Neoloader Recovery
RECOVERY_HOME_BODY=Dette er recovery-interfacet. Hvis du ikke selv aabnede denne menu, kan Neoloader have haft en kritisk fejl under indlaesning. Brug siderne til venstre til at gennemse logs, aendre hvilke plugins der indlaeses, eller koere recovery-handlinger for at loese problemer.
RECOVERY_HOME_WARN=Aendre kun det noedvendige. Nogle aendringer kan traede i kraft med det samme, mens andre foerst virker ved naeste indlaesning.
RECOVERY_HOME_OPEN_LME=Aabn LME-manager
RECOVERY_HOME_CLOSE=Luk recovery
RECOVERY_HOME_OPEN_PLUGINS=Aabn plugin-indstillinger
RECOVERY_HOME_OPEN_RESOLUTIONS=Aabn recovery-vaerktojer
RECOVERY_HOME_OPEN_LOGS=Vis logs
RECOVERY_HOME_ACCESS_CONSOLE=Aabn spil-konsol

RECOVERY_SUGGEST_FS_FAILURE=Filsystemkontrol fejlede. Din LME-udbyder er muligvis ikke korrekt installeret.
RECOVERY_SUGGEST_NEO_FAILURE=Neoloader fejlede tidligt. Tjek logs for flere detaljer. Din LME-udbyder er muligvis ikke korrekt installeret eller skal opdateres.
RECOVERY_SUGGEST_LIB_FAILURE=Kerne-API er ikke tilgaengelig. Tjek logs for flere detaljer. Din LME-udbyder er muligvis ikke korrekt installeret eller skal opdateres.
RECOVERY_SUGGEST_LME_FAILURE=LME-udbyderen blev ikke faerdig med at indlaese. Proev sikre LME-indstillinger.
RECOVERY_SUGGEST_VO_FAILURE=Spilinterfacet ser ikke ud til at vaere aabnet. Proev manuelt at starte spillets standardinterface fra recovery-fanen.
RECOVERY_SUGGEST_ALL_SUCCESS=Ingen kritiske fejl fundet i din LME-udbyder. Hvis du ikke selv aabnede dette interface, kan et ikke-LME plugin have fejlet, eller der er opstaaet et mindre problem.

RECOVERY_LOGS_TITLE=Recovery-logs
RECOVERY_LOGS_DESCRIP=Disse logs kan hjaelpe med at identificere hvilket plugin eller system der fejlede under indlaesning.
RECOVERY_LOGS_REFRESH=Opdater logs
RECOVERY_LOGS_PAGE=Side
RECOVERY_LOGS_PREV=Forrige
RECOVERY_LOGS_NEXT=Naeste
RECOVERY_LOGS_PREAMBLE_RLOG=Recovery-log
RECOVERY_LOGS_PREAMBLE_RLOG_EMPTY=Recovery-log er tom.
RECOVERY_LOGS_LME_LOG=Fuld Neoloader-log:

RECOVERY_RESOLVE_NONE=Ingen recovery-handling valgt.
RECOVERY_WAITING_FOR_SELECTION=Venter paa valg...
RECOV_SELECT_NEW_RESOLV=Vaelg en recovery-handling ovenfor. De er sorteret efter alvor; hvis du er i tvivl, anbefales det at proeve dem i raekkefoelge.

RECOVERY_CONFIG_MENU_PRE_DESCRIP=Indstil LME-valg og indlaesningstilstande for registrerede plugins her. LME er endnu ikke indlaest, saa nogle indstillinger vil foerst gaelde ved naeste opstart eller kun delvist i denne session.
RECOVERY_CONFIG_MENU_POST_DESCRIP=Indstil LME-valg og indlaesningstilstande for registrerede plugins her. LME er indlaest, saa direkte styring er mulig.
RECOVERY_PLUGIN_CARD_PRE=Registreret plugin-indlaesningstilstand.

RECOVERY_DEV_PLACEHOLDER=Udviklervaerktojer er endnu ikke implementeret.

RECOVERY_NAV_TITLE=Recovery
RECOVERY_NAV_HOME=Hjem
RECOVERY_NAV_RESOLVE=Handlinger
RECOVERY_NAV_PLUGINS=Plugins
RECOVERY_NAV_LOGS=Logs
RECOVERY_NAV_DEV=Udviklervaerktojer

BINARY_YES=YES
BINARY_NO=NO

launch_mode=Starttilstand
allow_bad_api_version=Tillad ugyldig API-version
default_load_state=Standard indlaesningstilstand
independent=independent
cooperative=cooperative

reload_TITLE=Genindlaes spil
reload_DESCRIP=Genindlaeser spilinterface og plugins. Nogle gange kan en fejl vaere midlertidig og loeses ved at genindlaese spillet. Brug ogsaa dette hvis du selv har aendret spilfiler for at rette fejlen.

show_console_TITLE=Vis konsol
show_console_DESCRIP=Aabner spillets konsol til fejlfinding.

vo_if_TITLE=Start standardinterface
vo_if_DESCRIP=Forsoeger at starte Vendettas standardinterface.

quit_TITLE=Luk Vendetta Online
quit_DESCRIP=Lukker spillet helt. Anbefales hvis flere genindlaesninger ikke giver mening.

LME_open_config_TITLE=Aabn LME-styringsinterface
LME_open_config_DESCRIP=Hvis LME er indlaest korrekt, kan du styre plugins og indstillinger direkte. Recovery forbliver aaben i baggrunden.

LME_disable_plugins_pre_TITLE=Deaktiver alle registrerede LME-plugins
LME_disable_plugins_pre_DESCRIP=Deaktiverer alle plugins saa LME ikke indlaeser dem ved naeste session.

LME_disable_plugins_post_TITLE=Deaktiver alle registrerede LME-plugins
LME_disable_plugins_post_DESCRIP=Deaktiverer alle plugins saa LME ikke indlaeser dem ved naeste session.

safe_LME_settings_pre_TITLE=Anvend sikre LME-indstillinger
safe_LME_settings_pre_DESCRIP=Anvender sikre LME-indstillinger i denne session (foer LME er indlaest)

safe_LME_settings_post_TITLE=Anvend sikre LME-indstillinger
safe_LME_settings_post_DESCRIP=Deaktiverer potentielt problematiske indstillinger i din LME-udbyder. Nogle plugins kan blive deaktiveret.

disable_all_plugins_TITLE=Deaktiver alle plugins
disable_all_plugins_DESCRIP=Deaktiverer spillets evne til at indlaese plugins og lukker spillet. Ved naeste start vil ingen plugins blive koert. For at aktivere plugins igen, skal du slaa dem til i indstillingerne.

uninstall_lme_TITLE=Fjern Neoloader
uninstall_lme_DESCRIP=Hvis din LME-opsaetning opfoerer sig forkert, vil denne mulighed fjerne indstillinger og forhindre Neoloader i at koere indtil det installeres igen. Brug ogsaa dette ved opdatering hvis standardafinstallering ikke virker.

nuke_settings_TITLE=Total nulstilling
nuke_settings_DESCRIP=Fjerner saa meget LME-data som muligt fra config.ini, deaktiverer alle plugins og nulstiller visse spilindstillinger til sikre vaerdier. Hvis dette ikke loeser problemet, er manuel hjaelp noedvendig.

RECOV_STARTUP_MGR_CHECK_DISABLED=Neoloader kunne ikke finde et aktiveret plugin til LME-styring
RECOV_STARTUP_MGR_CHECK_FAILURE=Neoloader kunne ikke finde noget plugin til LME-styring

enable_neomgr_TITLE=Proev at aktivere 'neomgr'
enable_neomgr_DESCRIP='neomgr' er et interface inkluderet med Neoloader, men ser ud til at vaere deaktiveret. Brug denne recovery-handling for at aktivere det.