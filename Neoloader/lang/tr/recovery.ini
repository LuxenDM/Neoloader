[recovery]
RECOV_MISSING_CORE_FILES=Neoloader kritik bir hatayla karsilasti ve baslatilamiyor!\nNeoloader'in calismasi icin gerekli dosyalar bulunamadi.\nEksik dosyalar:
RECOV_FS_MISSING_MODULE=Neoloader gerekli bir modulu bulamadi
RECOV_FS_FAILED_MODULE=Neoloader gerekli bir modulu yukleyemedi
RECOV_RUN=Bu islemi calistir
RECOV_RUN_FAIL=Islem basarisiz oldu: 
RECOV_USER_ACCESS_NOTIF=Recovery kullanici tarafindan acildi

RECOV_PREAMBLE=Recovery tarafindan yakalanan hatalar
RECOV_PREAMBLE_EMPTY=Recovery herhangi bir dogrudan hata yakalamadi.
RECOV_FULL_LOG=Tam Neoloader kaydi

RECOVERY_HOME_TITLE=Neoloader Recovery
RECOVERY_HOME_BODY=Bu recovery arayuzudur. Bu menuyu manuel olarak acmadiysan, Neoloader yuklenirken kritik bir hata olusmus olabilir. Soldaki bolumleri kullanarak kayitlari inceleyebilir, hangi eklentilerin yuklenecegini degistirebilir veya sorunlari gidermek icin recovery islemlerini calistirabilirsin.
RECOVERY_HOME_WARN=Sadece gerekli olanlari degistir. Bazi degisiklikler hemen uygulanabilirken, bazilari bir sonraki yuklemede tam olarak etkili olur.
RECOVERY_HOME_OPEN_LME=LME yoneticisini ac
RECOVERY_HOME_CLOSE=Recovery'i kapat
RECOVERY_HOME_OPEN_PLUGINS=Eklenti ayarlarini ac
RECOVERY_HOME_OPEN_RESOLUTIONS=Recovery araclarini ac
RECOVERY_HOME_OPEN_LOGS=Kayitlari goruntule
RECOVERY_HOME_ACCESS_CONSOLE=Oyun konsolunu ac

RECOVERY_SUGGEST_FS_FAILURE=Dosya sistemi kontrolu basarisiz oldu. LME saglayicin dogru sekilde yuklenmemis olabilir.
RECOVERY_SUGGEST_NEO_FAILURE=Neoloader erken bir asamada basarisiz oldu. Daha fazla bilgi icin kayitlari kontrol et. LME saglayicin dogru yuklenmemis olabilir veya guncellenmesi gerekebilir.
RECOVERY_SUGGEST_LIB_FAILURE=Temel API kullanilamiyor. Daha fazla bilgi icin kayitlari kontrol et. LME saglayicin dogru yuklenmemis olabilir veya guncellenmesi gerekebilir.
RECOVERY_SUGGEST_LME_FAILURE=LME saglayici yuklemeyi tamamlayamadi. Guvenli LME ayarlarini dene.
RECOVERY_SUGGEST_VO_FAILURE=Oyun arayuzu acilmamis gorunuyor. Recovery sekmesinden oyunun varsayilan arayuzunu manuel olarak baslatmayi dene.
RECOVERY_SUGGEST_ALL_SUCCESS=LME saglayicinda kritik bir hata tespit edilmedi. Bu arayuzu sen acmadiysan, LME disi bir eklenti basarisiz olmus olabilir veya kritik olmayan bir sorun yasanmis olabilir.

RECOVERY_LOGS_TITLE=Recovery kayitlari
RECOVERY_LOGS_DESCRIP=Bu kayitlar, yukleme sirasinda hangi eklenti veya sistemin basarisiz oldugunu belirlemeye yardimci olabilir.
RECOVERY_LOGS_REFRESH=Kayitlari yenile
RECOVERY_LOGS_PAGE=Sayfa
RECOVERY_LOGS_PREV=Onceki
RECOVERY_LOGS_NEXT=Sonraki
RECOVERY_LOGS_PREAMBLE_RLOG=Recovery kaydi
RECOVERY_LOGS_PREAMBLE_RLOG_EMPTY=Recovery kaydi bos.
RECOVERY_LOGS_LME_LOG=Tam Neoloader kaydi:

RECOVERY_RESOLVE_NONE=Herhangi bir recovery secenegi secilmedi.
RECOVERY_WAITING_FOR_SELECTION=Secim bekleniyor...
RECOV_SELECT_NEW_RESOLV=Yukaridan bir recovery islemi sec. Onem sirasina gore listelenmistir; sorunu nasil duzeltecegini bilmiyorsan sirayla denemen onerilir.

RECOVERY_CONFIG_MENU_PRE_DESCRIP=Buradan LME ayarlarini ve kayitli eklentilerin yuklenme durumlarini ayarla. LME henuz yuklenmedi, bu nedenle bazi ayarlar ancak bir sonraki calistirmada etkili olabilir veya bu oturumda kisitli sekilde uygulanabilir.
RECOVERY_CONFIG_MENU_POST_DESCRIP=Buradan LME ayarlarini ve kayitli eklentilerin yuklenme durumlarini ayarla. LME yuklendi, bu nedenle ayarlar dogrudan yonetilebilir.
RECOVERY_PLUGIN_CARD_PRE=Kayitli eklenti yuklenme durumu.

RECOVERY_DEV_PLACEHOLDER=Gelisitirici araclari henuz uygulanmadi.

RECOVERY_NAV_TITLE=Recovery
RECOVERY_NAV_HOME=Ana sayfa
RECOVERY_NAV_RESOLVE=Islemler
RECOVERY_NAV_PLUGINS=Eklentiler
RECOVERY_NAV_LOGS=Kayitlar
RECOVERY_NAV_DEV=Gelisitirici araclari

BINARY_YES=YES
BINARY_NO=NO

launch_mode=Baslatma modu
allow_bad_api_version=Gecersiz API surumune izin ver
default_load_state=Varsayilan yuklenme durumu
independent=independent
cooperative=cooperative

reload_TITLE=Oyunu yeniden yukle
reload_DESCRIP=Oyun arayuzunu ve eklentileri yeniden yukler. Bazen bir hata gecici olabilir ve sadece yeniden yukleme ile duzelebilir. Ayrica oyunu duzeltmek icin dosyalari degistirdiysen bu secenegi kullanmalisin.

show_console_TITLE=Konsolu goster
show_console_DESCRIP=Hata ayiklama icin oyun konsolunu acar.

vo_if_TITLE=Varsayilan arayuzu baslat
vo_if_DESCRIP=Vendetta'nin varsayilan arayuzunu baslatmayi dener.

quit_TITLE=Vendetta Online'i kapat
quit_DESCRIP=Oyunu tamamen kapatir. Birden fazla yeniden yuklemeden sonra sorunlar anlamsiz gorunuyorsa onerilir.

LME_open_config_TITLE=LME yonetim arayuzunu ac
LME_open_config_DESCRIP=LME basariyla yuklendiyse, eklentileri ve ayarlari dogrudan yonetebilirsin. Recovery arka planda acik kalir.

LME_disable_plugins_pre_TITLE=Tum kayitli LME eklentilerini devre disi birak
LME_disable_plugins_pre_DESCRIP=Tum eklentileri devre disi birakir, boylece LME bir sonraki oturumda yuklemez.

LME_disable_plugins_post_TITLE=Tum kayitli LME eklentilerini devre disi birak
LME_disable_plugins_post_DESCRIP=Tum eklentileri devre disi birakir, boylece LME bir sonraki oturumda yuklemez.

safe_LME_settings_pre_TITLE=Guvenli LME ayarlarini uygula
safe_LME_settings_pre_DESCRIP=Bu oturumda guvenli LME ayarlarini uygular (LME yuklenmeden once)

safe_LME_settings_post_TITLE=Guvenli LME ayarlarini uygula
safe_LME_settings_post_DESCRIP=LME saglayicindaki sorunlu olabilecek ayarlari kapatir. Sonuc olarak bazi eklentiler devre disi kalabilir.

disable_all_plugins_TITLE=Tum eklentileri devre disi birak
disable_all_plugins_DESCRIP=Oyunun eklenti yukleme yetenegini kapatir ve oyunu kapatir. Bir sonraki baslatmada hicbir eklenti calismaz. Eklentileri tekrar kullanmak icin ayarlardan yeniden etkinlestirmelisin.

uninstall_lme_TITLE=Neoloader'i kaldir
uninstall_lme_DESCRIP=LME ortamin sorunluysa, bu secenek ayarlari siler ve Neoloader yeniden yuklenene kadar calismasini engeller. Ayrica Neoloader'i guncellemek istiyorsan ve standart kaldirma islemi calismiyorsa bunu kullanmalisin.

nuke_settings_TITLE=Tam sifirlama
nuke_settings_DESCRIP=Config.ini dosyasindan mumkun oldugunca fazla LME verisini siler, tum eklentileri devre disi birakir ve bazi oyun ayarlarini guvenli degerlere sifirlar. Bu da sorunu cozmezse manuel yardim gerekir.

RECOV_STARTUP_MGR_CHECK_DISABLED=Neoloader LME yonetimi icin etkin bir eklenti bulamadi
RECOV_STARTUP_MGR_CHECK_FAILURE=Neoloader LME yonetimi icin hicbir eklenti bulamadi

enable_neomgr_TITLE='neomgr' etkinlestirilmeye calisiliyor
enable_neomgr_DESCRIP='neomgr' Neoloader ile gelen bir arayuzdur, ancak devre disi gorunuyor. Bunu etkinlestirmek icin bu recovery islemini kullan.