[recovery]
RECOV_MISSING_CORE_FILES=Neoloader renkontis kritikan eraron kaj ne povas starti!\nBezonataj dosieroj por la funkciado de Neoloader ne estis trovitaj.\nMankantaj dosieroj:
RECOV_FS_MISSING_MODULE=Neoloader ne povis trovi bezonatan modulon
RECOV_FS_FAILED_MODULE=Neoloader ne povis sxargi bezonatan modulon
RECOV_RUN=Ruli cxi tiun agon
RECOV_RUN_FAIL=Ago malsukcesis: 
RECOV_USER_ACCESS_NOTIF=Recovery malfermita de uzanto

RECOV_PREAMBLE=Eraroj kaptitaj de recovery
RECOV_PREAMBLE_EMPTY=Recovery ne kaptis rektajn erarojn.
RECOV_FULL_LOG=Plena Neoloader-protokolo

RECOVERY_HOME_TITLE=Neoloader Recovery
RECOVERY_HOME_BODY=Cxi tio estas la recovery-interfaco. Krom se vi permane malfermis cxi tiun menuon, Neoloader eble renkontis katastrofan eraron dum sxargado. Uzu la pagxojn maldekstre por kontroli protokolojn, sxangxi kiuj kromajxoj sxargxas, aux ruli recovery-agojn por provi ripari detektitajn problemojn.
RECOVERY_HOME_WARN=Nur sxangxu tion, kio necesas. Iuj sxangxoj eble efikos tuj, dum aliaj eble bezonos la sekvan sxargon por plene efiki.
RECOVERY_HOME_OPEN_LME=Malfermi LME-administrilon
RECOVERY_HOME_CLOSE=Fermi recovery
RECOVERY_HOME_OPEN_PLUGINS=Malfermi kromajxajn kontrolojn
RECOVERY_HOME_OPEN_RESOLUTIONS=Malfermi recovery-ilojn
RECOVERY_HOME_OPEN_LOGS=Vidi protokolojn
RECOVERY_HOME_ACCESS_CONSOLE=Malfermi ludan konzolon

RECOVERY_SUGGEST_FS_FAILURE=Kontrolo de dosiersistemo malsukcesis. Via LME-provizanto eble ne estis gxuste instalita.
RECOVERY_SUGGEST_NEO_FAILURE=Neoloader malsukcesis frue. Kontrolu la protokolojn por pliaj detaloj. Via LME-provizanto eble ne estis gxuste instalita aux bezonas gxisdatigon.
RECOVERY_SUGGEST_LIB_FAILURE=Kerna API ne disponeblas. Kontrolu la protokolojn por pliaj detaloj. Via LME-provizanto eble ne estis gxuste instalita aux bezonas gxisdatigon.
RECOVERY_SUGGEST_LME_FAILURE=La LME-provizanto ne finis sxargxi. Provu sekurajn LME-agordojn.
RECOVERY_SUGGEST_VO_FAILURE=La luda interfaco sxajne ne malfermigxis. Provu permane lanccxi la defauxltan interfacon de la ludo el la recovery-langeto.
RECOVERY_SUGGEST_ALL_SUCCESS=Neniuj kritikaj misfunkcioj estis detektitaj en via LME-provizanto. Se vi mem ne malfermis cxi tiun interfacon, ne-LME kromajxo eble malsukcesis aux okazis ne-kritika problemo.

RECOVERY_LOGS_TITLE=Recovery-protokoloj
RECOVERY_LOGS_DESCRIP=Cxi tiuj protokoloj povas helpi identigi kiu kromajxo aux sistemo malsukcesis dum sxargado.
RECOVERY_LOGS_REFRESH=Refresxigi protokolojn
RECOVERY_LOGS_PAGE=Pagxo
RECOVERY_LOGS_PREV=Antauxa
RECOVERY_LOGS_NEXT=Sekva
RECOVERY_LOGS_PREAMBLE_RLOG=Recovery-protokolo
RECOVERY_LOGS_PREAMBLE_RLOG_EMPTY=Recovery-protokolo estas malplena.
RECOVERY_LOGS_LME_LOG=Plena Neoloader-protokolo:

RECOVERY_RESOLVE_NONE=Neniu recovery-opcio elektita.
RECOVERY_WAITING_FOR_SELECTION=Atendante elekton...
RECOV_SELECT_NEW_RESOLV=Elektu recovery-agon supre. Ili estas listigitaj lau graveco; se vi ne certas kiel mem ripari la cimon, estas rekomendinde provi ilin lauvice.

RECOVERY_CONFIG_MENU_PRE_DESCRIP=Agordu cxi tie LME-opciojn kaj sxargxostatojn de registritaj kromajxoj. La LME ankoraux ne sxargxis, do iuj opcioj eble validos nur je la sekva ludsxargo, aux nur parte validos en cxi tiu sesio.
RECOVERY_CONFIG_MENU_POST_DESCRIP=Agordu cxi tie LME-opciojn kaj sxargxostatojn de registritaj kromajxoj. La LME sxargxis, ebligante rektan administradon de agordo.
RECOVERY_PLUGIN_CARD_PRE=Registrita sxargxostato de kromajxo.

RECOVERY_DEV_PLACEHOLDER=Programistaj iloj ankoraux ne estas efektivigitaj.

RECOVERY_NAV_TITLE=Recovery
RECOVERY_NAV_HOME=Hejmo
RECOVERY_NAV_RESOLVE=Agoj
RECOVERY_NAV_PLUGINS=Kromajxoj
RECOVERY_NAV_LOGS=Protokoloj
RECOVERY_NAV_DEV=Programistaj iloj

BINARY_YES=YES
BINARY_NO=NO

launch_mode=Lancx-reghimo
allow_bad_api_version=Permesi malbonan API-version
default_load_state=Defauxlta sxargxostato
independent=independent
cooperative=cooperative

reload_TITLE=Resxargi ludon
reload_DESCRIP=Resxargas la ludan interfacon kaj kromajxojn. Foje cimo povas esti hazarda kaj riparigxi simple per resxargo de la ludo. Cxi tiu estas ankaux la opcio elektebla se vi mem modifas viajn luddosierojn por ripari la cimon.

show_console_TITLE=Montri konzolon
show_console_DESCRIP=Malfermas la ludan konzolon por sencimigaj eligajxoj.

vo_if_TITLE=Lanccxi defauxltan interfacon
vo_if_DESCRIP=Provas lanccxi la defauxltan Vendetta-interfacon.

quit_TITLE=Fermi Vendetta Online
quit_DESCRIP=Fermas la ludon tute. Rekomendinda se vi jam uzis plurajn resxargojn kaj la cimoj aspektas sensencaj.

LME_open_config_TITLE=Malfermi LME-administran interfacon
LME_open_config_DESCRIP=Se via LME sukcese sxargxis, vi eble povos administri kromajxojn kaj agordojn rekte. Recovery restos malfermita en la fono.

LME_disable_plugins_pre_TITLE=Malaktivigi cxiujn registritajn LME-kromajxojn
LME_disable_plugins_pre_DESCRIP=Malaktivigas cxiujn kromajxojn tiel ke la LME ne sxargos ilin en la sekva sesio.

LME_disable_plugins_post_TITLE=Malaktivigi cxiujn registritajn LME-kromajxojn
LME_disable_plugins_post_DESCRIP=Malaktivigas cxiujn kromajxojn tiel ke la LME ne sxargos ilin en la sekva sesio.

safe_LME_settings_pre_TITLE=Apliki sekurajn LME-agordojn
safe_LME_settings_pre_DESCRIP=Aplikas sekurajn LME-agordojn en cxi tiu sesio (antaux ol la LME sxargxis)

safe_LME_settings_post_TITLE=Apliki sekurajn LME-agordojn
safe_LME_settings_post_DESCRIP=Malaktivigas eble problemajn agordojn en via LME-provizanto. Sekve, iuj kromajxoj eble estos malaktivigitaj.

disable_all_plugins_TITLE=Malaktivigi cxiujn kromajxojn
disable_all_plugins_DESCRIP=Malaktivigas la kapablon de la ludo sxargi kromajxojn kaj fermas la ludon. Kiam la ludo estos sekve lanccxita, neniuj kromajxoj povos funkcii. Por denove permesi kromajxojn, vi devos reaktivigi ilin en via opcia menuo.

uninstall_lme_TITLE=Malinstali Neoloader
uninstall_lme_DESCRIP=Se via LME-medio kondutas malbone, cxi tiu opcio forigos la agordojn kaj malhelpos Neoloader funkcii gxis gxi estos denove instalita. Vi ankaux uzu cxi tiun opcion se vi volas gxisdatigi Neoloader kaj la norma malinstalilo ne funkcias.

nuke_settings_TITLE=Tuta restarigo
nuke_settings_DESCRIP=Forigas kiom eble plej multe da LME-datumoj el via config.ini, malaktivigas cxiujn kromajxojn, kaj restarigas certajn ludajn opciojn al konataj sekuraj agordoj. Se tio ne riparas vian ludon, vi bezonos helpon, kiun auxtomata sistemo ne povas provizi.

RECOV_STARTUP_MGR_CHECK_DISABLED=Neoloader malsukcesis trovi aktivigitan kromajxon por LME-administrado
RECOV_STARTUP_MGR_CHECK_FAILURE=Neoloader malsukcesis trovi iun ajn kromajxon por LME-administrado

enable_neomgr_TITLE=Provi aktivigi 'neomgr'
enable_neomgr_DESCRIP='neomgr' estas fasado kunligita kun Neoloader, sed sxajnas esti malaktivigita. Uzu cxi tiun recovery-agon por provi aktivigi gxin.