[recovery]
RECOV_MISSING_CORE_FILES=Neoloader mengalami kesalahan kritis dan tidak dapat dimulai!\nFile yang dibutuhkan untuk menjalankan Neoloader tidak ditemukan.\nFile yang hilang:
RECOV_FS_MISSING_MODULE=Neoloader gagal menemukan modul yang dibutuhkan
RECOV_FS_FAILED_MODULE=Neoloader gagal memuat modul yang dibutuhkan
RECOV_RUN=Jalankan tindakan ini
RECOV_RUN_FAIL=Tindakan gagal: 
RECOV_USER_ACCESS_NOTIF=Recovery dibuka oleh pengguna

RECOV_PREAMBLE=Kesalahan yang ditangkap oleh recovery
RECOV_PREAMBLE_EMPTY=Recovery tidak menangkap kesalahan langsung apa pun.
RECOV_FULL_LOG=Log Neoloader lengkap

RECOVERY_HOME_TITLE=Neoloader Recovery
RECOVERY_HOME_BODY=Ini adalah antarmuka recovery. Kecuali kamu membuka menu ini secara manual, Neoloader mungkin mengalami kesalahan fatal saat mencoba memuat. Gunakan halaman di sebelah kiri untuk memeriksa log, mengubah plugin yang dimuat, atau menjalankan tindakan recovery untuk mencoba memperbaiki masalah yang terdeteksi.
RECOVERY_HOME_WARN=Ubah hanya yang diperlukan. Beberapa perubahan dapat langsung berlaku, sementara yang lain mungkin baru sepenuhnya berlaku pada pemuatan berikutnya.
RECOVERY_HOME_OPEN_LME=Buka pengelola LME
RECOVERY_HOME_CLOSE=Tutup recovery
RECOVERY_HOME_OPEN_PLUGINS=Buka kontrol plugin
RECOVERY_HOME_OPEN_RESOLUTIONS=Buka alat recovery
RECOVERY_HOME_OPEN_LOGS=Lihat log
RECOVERY_HOME_ACCESS_CONSOLE=Buka konsol game

RECOVERY_SUGGEST_FS_FAILURE=Pemeriksaan sistem file gagal. Penyedia LME kamu mungkin tidak terpasang dengan benar.
RECOVERY_SUGGEST_NEO_FAILURE=Neoloader gagal pada tahap awal. Periksa log untuk detail lebih lanjut. Penyedia LME kamu mungkin tidak terpasang dengan benar atau perlu diperbarui.
RECOVERY_SUGGEST_LIB_FAILURE=API inti tidak tersedia. Periksa log untuk detail lebih lanjut. Penyedia LME kamu mungkin tidak terpasang dengan benar atau perlu diperbarui.
RECOVERY_SUGGEST_LME_FAILURE=Penyedia LME tidak menyelesaikan proses pemuatan. Coba pengaturan LME yang aman.
RECOVERY_SUGGEST_VO_FAILURE=Antarmuka game tampaknya tidak terbuka. Coba jalankan antarmuka bawaan game secara manual dari tab recovery.
RECOVERY_SUGGEST_ALL_SUCCESS=Tidak ada kegagalan kritis yang terdeteksi pada penyedia LME kamu. Jika kamu tidak membuka antarmuka ini sendiri, plugin non-LME mungkin gagal atau terjadi masalah non-kritis.

RECOVERY_LOGS_TITLE=Log recovery
RECOVERY_LOGS_DESCRIP=Log ini dapat membantu mengidentifikasi plugin atau sistem mana yang gagal saat pemuatan.
RECOVERY_LOGS_REFRESH=Muat ulang log
RECOVERY_LOGS_PAGE=Halaman
RECOVERY_LOGS_PREV=Sblm
RECOVERY_LOGS_NEXT=Brkt
RECOVERY_LOGS_PREAMBLE_RLOG=Log recovery
RECOVERY_LOGS_PREAMBLE_RLOG_EMPTY=Log recovery kosong.
RECOVERY_LOGS_LME_LOG=Log Neoloader lengkap:

RECOVERY_RESOLVE_NONE=Tidak ada opsi recovery yang dipilih.
RECOVERY_WAITING_FOR_SELECTION=Menunggu pilihan...
RECOV_SELECT_NEW_RESOLV=Pilih tindakan recovery di atas. Tindakan diurutkan berdasarkan tingkat keparahan; jika kamu tidak yakin bagaimana memperbaiki masalahnya, disarankan untuk mencobanya secara berurutan.

RECOVERY_CONFIG_MENU_PRE_DESCRIP=Atur opsi LME dan status muat plugin yang terdaftar di sini. LME belum dimuat, jadi beberapa opsi mungkin baru berlaku saat game dijalankan lagi atau hanya berlaku sebagian pada sesi ini.
RECOVERY_CONFIG_MENU_POST_DESCRIP=Atur opsi LME dan status muat plugin yang terdaftar di sini. LME sudah dimuat, sehingga pengelolaan konfigurasi secara langsung dapat dilakukan.
RECOVERY_PLUGIN_CARD_PRE=Status muat plugin yang terdaftar.

RECOVERY_DEV_PLACEHOLDER=Alat pengembang belum diimplementasikan.

RECOVERY_NAV_TITLE=Recovery
RECOVERY_NAV_HOME=Beranda
RECOVERY_NAV_RESOLVE=Tindakan
RECOVERY_NAV_PLUGINS=Plugin
RECOVERY_NAV_LOGS=Log
RECOVERY_NAV_DEV=Alat pengembang

BINARY_YES=YES
BINARY_NO=NO

launch_mode=Mode peluncuran
allow_bad_api_version=Izinkan versi API yang tidak valid
default_load_state=Status muat bawaan
independent=independent
cooperative=cooperative

reload_TITLE=Muat ulang game
reload_DESCRIP=Memuat ulang antarmuka game dan plugin. Terkadang bug bisa bersifat sementara dan dapat diperbaiki hanya dengan memuat ulang game. Ini juga opsi yang harus dipilih jika kamu mengubah file game sendiri untuk memperbaiki bug.

show_console_TITLE=Tampilkan konsol
show_console_DESCRIP=Membuka konsol game untuk keluaran debug.

vo_if_TITLE=Jalankan antarmuka bawaan
vo_if_DESCRIP=Mencoba menjalankan antarmuka bawaan Vendetta.

quit_TITLE=Tutup Vendetta Online
quit_DESCRIP=Menutup game sepenuhnya. Disarankan jika kamu sudah beberapa kali memuat ulang dan bug mulai terlihat tidak masuk akal.

LME_open_config_TITLE=Buka antarmuka pengelolaan LME
LME_open_config_DESCRIP=Jika LME berhasil dimuat, kamu mungkin dapat mengelola plugin dan pengaturan secara langsung. Recovery akan tetap terbuka di latar belakang.

LME_disable_plugins_pre_TITLE=Nonaktifkan semua plugin LME yang terdaftar
LME_disable_plugins_pre_DESCRIP=Menonaktifkan semua plugin agar LME tidak memuatnya pada sesi berikutnya.

LME_disable_plugins_post_TITLE=Nonaktifkan semua plugin LME yang terdaftar
LME_disable_plugins_post_DESCRIP=Menonaktifkan semua plugin agar LME tidak memuatnya pada sesi berikutnya.

safe_LME_settings_pre_TITLE=Terapkan pengaturan LME aman
safe_LME_settings_pre_DESCRIP=Menerapkan pengaturan LME aman pada sesi ini (sebelum LME dimuat)

safe_LME_settings_post_TITLE=Terapkan pengaturan LME aman
safe_LME_settings_post_DESCRIP=Menonaktifkan pengaturan konfigurasi yang berpotensi bermasalah pada penyedia LME kamu. Beberapa plugin mungkin ikut dinonaktifkan.

disable_all_plugins_TITLE=Nonaktifkan semua plugin
disable_all_plugins_DESCRIP=Menonaktifkan kemampuan game untuk memuat plugin dan menutup game. Saat game dijalankan lagi, tidak ada plugin yang dapat berjalan. Untuk mengaktifkan plugin lagi, kamu harus mengaktifkannya kembali dari menu opsi.

uninstall_lme_TITLE=Copot Neoloader
uninstall_lme_DESCRIP=Jika lingkungan LME kamu bermasalah, opsi ini akan menghapus pengaturan dan mencegah Neoloader berjalan sampai dipasang lagi. Gunakan opsi ini juga jika kamu ingin memperbarui Neoloader dan pencopot bawaan tidak berfungsi.

nuke_settings_TITLE=Reset total
nuke_settings_DESCRIP=Menghapus sebanyak mungkin data LME dari config.ini, menonaktifkan semua plugin, dan mengatur ulang beberapa opsi game ke pengaturan aman yang diketahui. Jika ini tidak memperbaiki game, kamu memerlukan bantuan yang tidak dapat diberikan sistem otomatis.

RECOV_STARTUP_MGR_CHECK_DISABLED=Neoloader gagal menemukan plugin aktif untuk pengelolaan LME
RECOV_STARTUP_MGR_CHECK_FAILURE=Neoloader gagal menemukan plugin apa pun untuk pengelolaan LME

enable_neomgr_TITLE=Coba aktifkan 'neomgr'
enable_neomgr_DESCRIP='neomgr' adalah frontend yang disertakan bersama Neoloader, tetapi tampaknya dinonaktifkan. Gunakan tindakan recovery ini untuk mencoba mengaktifkannya.