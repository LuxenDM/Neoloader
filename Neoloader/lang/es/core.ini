RECOVERY_LOAD_ERROR=No se pudo cargar el sistema de recovery. Error:
RECOVERY_EXEC_ERROR=No se pudo iniciar el sistema de recovery. Error:
MISSING_RECOVERY_2=La verificacion de recovery paso, pero el sistema no estaba listo cuando fallo un archivo central.
RECOV_STARTUP_MGR_CHECK_DISABLED=Neoloader no encontro un plugin habilitado para la gestion del LME. Se agrego una opcion de recovery para intentar habilitar neomgr.
RECOV_STARTUP_MGR_CHECK_FAILURE=Neoloader no encontro ningun plugin para la gestion del LME.

[AUTH]
GRANT_AUTH=Dar acceso
DENY_AUTH=Denegar acceso
REQUEST_AUTH=solicita permiso de gestion sobre Neoloader

[main]
