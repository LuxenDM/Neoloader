[recovery]
RECOVERY_FAILSAFE=Neoloader encontro un error critico y no se cargara. El sistema de seguridad se ha activado y se cargara la interfaz predeterminada. Error indicado
RECOVERY_CONFIRM=Aceptar
DIR_FIND_FAIL=local_dir_find_failure: No se pudo determinar el directorio base con los metodos disponibles.
RECOVERY_NOT_FOUND=No se encontro el sistema de recovery. Ruta esperada:
