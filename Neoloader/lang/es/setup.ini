[setup]
LOCALE_SELECT=Selecciona tu idioma.
MAINGREET=Neoloader se esta ejecutando por primera vez o fue actualizado recientemente. Esta configuracion te ayudara a elegir como se comporta.
DESCRIPAUTH=Algunas opciones necesitan tu aprobacion antes de cambiarse. Esto evita que los plugins modifiquen funciones importantes sin tu permiso.
usedef=Usar opciones predeterminadas
SELECTCFGLEVEL=Cuanta configuracion quieres revisar?
cfgstandard=Mostrar opciones de configuracion estandar
cfgadvanced=Mostrar opciones adicionales para desarrolladores de plugins
LANG_NOT_GAME_SUPPORTED=No compatible con el juego base
LANGUAGE_SUPPORT_NOTE=El idioma que has seleccionado no es compatible con el juego. Neoloader mostrara texto localizado, pero el juego permanecera en tu idioma actual.

default_load_state_name=Estado de carga predeterminado
default_load_state_descrip=Permite que los plugins se carguen automaticamente al registrarse. NO significa que deben activarse manualmente.

launch_mode_name=Modo de funcionamiento de Neoloader
launch_mode_descrip=Elige como inicia Neoloader. El modo independiente ejecuta Neoloader directamente. El modo cooperativo usa el cargador normal del juego, pero algunos plugins LME antiguos pueden no funcionar.
launch_mode_option_indp=independiente
launch_mode_option_coop=cooperativo

register_voidif_name=Registrar VoidIF
register_voidif_descrip=VoidIF es solo para configuraciones avanzadas y poco comunes de interfaz. Dejalo desactivado a menos que ya sepas que lo necesitas.
register_voidif_addonly=Solo registrar

override_disabled_plugin_state_name=Ejecutar Neoloader incluso cuando los plugins estan desactivados
override_disabled_plugin_state_descrip=En modo independiente, Neoloader respeta la opcion del juego que desactiva el cargador de plugins y deja de ejecutarse. Pon esto en SI para ignorar esa opcion y ejecutar Neoloader de todos modos.

stat_graphing_name=Activar registro periodico de rendimiento
stat_graphing_descrip=Registra periodicamente informacion de rendimiento y la escribe en el log para depuracion.

FINISH_SCREEN_MSG=Las opciones han sido configuradas. Gracias por usar Neoloader!
FINISH_SCREEN_DISCORD_INV=Si necesitas ayuda con Neoloader o con plugins en general, visita la comunidad de modding de Vendetta Online!
DISCORD_JOIN=Haz clic para unirte
FINISH_REMINDER_MSG=Puedes ejecutar la configuracion otra vez con '/neosetup', o abrir el administrador con '/neo'.
SETUP_BANNER_TEXT=Configuracion de Neoloader
