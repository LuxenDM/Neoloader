RECOV_STARTUP_MGR_CHECK_FAILURE=Neoloader failed to find any plugin for LME management

enable_neomgr_TITLE=Try enabling 'neomgr'
enable_neomgr_DESCRIP='neomgr' is a front-end bundled with Neoloader, but appears to be disabled. Use this resolution to attempt enabling it.