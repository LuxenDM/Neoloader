# Resolution keys (preferred convention)
reload_TITLE=Reload game
reload_DESCRIP=Reload the game interface and plugins. Sometimes a bug could be coincidental and fixed just by reloading the game. This is also the option to select if you modify your game files to fix the bug yourself.

show_console_TITLE=Show console
show_console_DESCRIP=Open the game console for debugging output.

vo_if_TITLE=Launch default interface
vo_if_DESCRIP=Attempt to launch the default Vendetta interface.

quit_TITLE=Close Vendetta Online
quit_DESCRIP=Exit the game completely. Recommended if you have used multiple reloads and bugs appear nonsensical.

LME_open_config_TITLE=Open LME management interface
LME_open_config_DESCRIP=If your LME loaded successfully, you may be able to manage plugins and settings directly. Recovery will remain open in the background.

LME_disable_plugins_pre_TITLE=Disable all registered LME plugins
LME_disable_plugins_pre_DESCRIP=Disable all plugins so the LME will not load them next session.

LME_disable_plugins_post_TITLE=Disable all registered LME plugins
LME_disable_plugins_post_DESCRIP=Disable all plugins so the LME will not load them next session.

safe_LME_settings_pre_TITLE=Apply safe LME settings
safe_LME_settings_pre_DESCRIP=Sets safe LME settings this session (before LME has loaded)

safe_LME_settings_post_TITLE=Apply safe LME settings
safe_LME_settings_post_DESCRIP=Turns off potentially problematic configuration settings in your LME provider. Some plugins may be disabled as a result.

disable_all_plugins_TITLE=Disable all plugins
disable_all_plugins_DESCRIP=Turns off the game's ability to load plugins and closes the game. When the game is next launched, no plugins will be able to run. To allow plugins to run again, you'll need to re-enable them from your options menu.

uninstall_lme_TITLE=Uninstall Neoloader
uninstall_lme_DESCRIP=If your LME environment is misbehaving, this option will remove the settings and prevent Neoloader from executing until installed again. You should also use this option if you want to upgrade Neoloader and the standard uninstaller doesn't work.

nuke_settings_TITLE=Nuclear reset
nuke_settings_DESCRIP=Removes as much LME data as possible from your config.ini, disables all plugins, and resets certain game options to known safe settings. If this doesn't fix your game, then you need help that an automated system cannot provide.

