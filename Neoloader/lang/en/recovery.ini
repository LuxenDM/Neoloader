[recovery]
RECOV_MISSING_CORE_FILES=Neoloader ran into a critical error and cannot start!\nRequired files for Neoloader's operation were not found.\nFiles missing:
RECOV_FS_MISSING_MODULE=Neoloader failed to find a required module
RECOV_FS_FAILED_MODULE=Neoloader failed to load a required module

#resolutions
reload_title=Reload all plugins
reload_descrip=Reload the game interface and plugins. Sometimes, a bug could be coincidental and fixed just by reloading the code. This is also the option to select if you modify your game files and fix the bug yourself.

show_console_title=Show game console
show_console_descrip=Open the game's internal console for debugging output.

vo_if_title=Launch the game's default interface
vo_if_descrip=Attempt to launch the game's normal interface, bypassing any continued execution. You may still see errors and plugins may be only partially loaded.

quit_title=Close Vendetta Online
quit_descrip=Exit the game completely. Recommended if you have used multiple reloads this session.