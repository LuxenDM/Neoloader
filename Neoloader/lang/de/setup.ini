cfgadvanced=Zusaetzliche Optionen fuer Plugin-Entwickler anzeigen
LANG_NOT_GAME_SUPPORTED=Vom Basisspiel nicht unterstuetzt
LANGUAGE_SUPPORT_NOTE=Die von dir ausgewaehlte Sprache wird vom Spiel nicht unterstuetzt. Neoloader zeigt lokalisierten Text an, aber das Spiel bleibt in deiner aktuellen Sprache.

default_load_state_name=Standard-Ladezustand
default_load_state_descrip=Erlaubt Plugins, nach der Registrierung automatisch zu laden. NO bedeutet, dass sie manuell aktiviert werden muessen.

launch_mode_name=Betriebsmodus von Neoloader
launch_mode_descrip=Waehle, wie Neoloader gestartet wird. Im independent-Modus startet Neoloader direkt. Im cooperative-Modus wird der normale Plugin-Loader des Spiels verwendet, aber einige aeltere LME-Plugins funktionieren moeglicherweise nicht.
launch_mode_option_indp=independent
launch_mode_option_coop=cooperative

register_voidif_name=VoidIF registrieren
register_voidif_descrip=VoidIF ist nur fuer ungewoehnliche erweiterte Interface-Setups gedacht. Lass dies ausgeschaltet, wenn du nicht bereits weisst, dass du es brauchst.
register_voidif_addonly=Nur registrieren

override_disabled_plugin_state_name=Neoloader auch bei deaktivierten Plugins ausfuehren
override_disabled_plugin_state_descrip=Im independent-Modus respektiert Neoloader die Spieleinstellung, die den Plugin-Loader deaktiviert und die Ausfuehrung stoppt. Setze dies auf YES, um diese Einstellung zu ignorieren und Neoloader trotzdem auszufuehren.

stat_graphing_name=Periodische Leistungsaufzeichnung aktivieren
stat_graphing_descrip=Zeichnet regelmaessig Leistungsinformationen auf und schreibt sie zur Fehlersuche ins Log.

FINISH_SCREEN_MSG=Die Optionen wurden konfiguriert; danke, dass du Neoloader verwendest!
FINISH_SCREEN_DISCORD_INV=Fuer Hilfe mit Neoloader oder Plugins im Allgemeinen besuche die Vendetta Online Modding Community!
DISCORD_JOIN=Zum Beitreten klicken
FINISH_REMINDER_MSG=Du kannst das Setup erneut mit '/neosetup' starten oder den Manager mit '/neo' oeffnen.
SETUP_BANNER_TEXT=Neoloader Setup

lang_current_notice=Derzeit ausgewählte Sprache
lang_select_completion_prompt=Nachdem Sie oben Ihre Sprache ausgewählt haben, klicken Sie auf „Weiter“, um fortzufahren.
