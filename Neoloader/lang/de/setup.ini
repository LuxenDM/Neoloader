LOCALE_SELECT=Waehle deine Sprache.
MAINGREET=Neoloader wird zum ersten Mal ausgefuehrt oder wurde kuerzlich aktualisiert. Dieses Setup hilft dir dabei, sein Verhalten zu konfigurieren.
DESCRIPAUTH=Einige Einstellungen benoetigen deine Zustimmung, bevor sie geaendert werden koennen. Dadurch wird verhindert, dass Plugins wichtiges Verhalten ohne deine Erlaubnis aendern.
usedef=Einfach Standardoptionen verwenden
SELECTCFGLEVEL=Wie viel Setup moechtest du durchlaufen?
