[metadata]
description=locale translations for the core systems of Neoloader (german)
owner=Neoloader|7.0.0
type=ini
created=2026-04-09
ini-meta=non-serial data|translation tables

[recovery]
RECOVERY_FAILSAFE=Neoloader hat einen kritischen Fehler festgestellt und wird nicht geladen. Das Failsafe-System wurde aktiviert, und die Standardoberflaeche wird jetzt geladen. Gemeldeter Fehler
RECOVERY_CONFIRM=Okay
DIR_FIND_FAIL=local_dir_find_failure: Das Home-Verzeichnis konnte mit den verfuegbaren Methoden nicht bestimmt werden.
RECOVERY_NOT_FOUND=Das Recovery-System wurde nicht gefunden. Erwarteter Pfad:
RECOVERY_NOT_FOUND_PCHECK= pathlock war 
RECOVERY_LOAD_ERROR=Das Recovery-System konnte nicht geladen werden. Fehler:
RECOVERY_EXEC_ERROR=Das Recovery-System konnte nicht gestartet werden. Fehler:
MISSING_RECOVERY_2=Recovery-Pruefung bestanden, aber das Recovery-System war nicht bereit, als die Pruefung einer Kerndatei fehlgeschlagen ist.
RECOV_STARTUP_MGR_CHECK_DISABLED=Neoloader konnte kein aktiviertes Plugin fuer die LME-Verwaltung finden. Es wurde eine Recovery-Option hinzugefuegt, um zu versuchen, neomgr zu aktivieren.
RECOV_STARTUP_MGR_CHECK_FAILURE=Neoloader konnte kein Plugin fuer die LME-Verwaltung finden.

[AUTH]
GRANT_AUTH=Zugriff gewaehren
DENY_AUTH=Zugriff verweigern
REQUEST_AUTH=fordert Verwaltungsberechtigung fuer Neoloader an

[main]
STOP_PRINT=Neoloader hatte beim letzten Ausfuehren einen katastrophalen Fehler, und die weitere Ausfuehrung wurde abgebrochen. Der gemeldete STOP-Code war
STOP_PRINT_2=Um diese Meldung zu entfernen und Neoloader neu zu initialisieren, benutze den Befehl /neo.
REM_PRINT=Neoloader ist deaktiviert. Um ihn wieder zu aktivieren und einzurichten, führe den Befehl /neo aus. Wenn du ihn nicht mehr benötigst, kannst du den Neoloader-Pluginordner jederzeit sicher löschen.
