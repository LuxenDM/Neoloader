[recovery]
RECOV_MISSING_CORE_FILES=Neoloader hat einen kritischen Fehler festgestellt und kann nicht starten!\nErforderliche Dateien fuer den Betrieb von Neoloader wurden nicht gefunden.\nFehlende Dateien:
RECOV_FS_MISSING_MODULE=Neoloader konnte ein erforderliches Modul nicht finden
RECOV_FS_FAILED_MODULE=Neoloader konnte ein erforderliches Modul nicht laden
RECOV_RUN=Diese Aktion ausfuehren
RECOV_RUN_FAIL=Ausfuehrung fehlgeschlagen: 
RECOV_USER_ACCESS_NOTIF=Recovery vom Benutzer geoeffnet

RECOV_PREAMBLE=Von Recovery erfasste Fehler
RECOV_PREAMBLE_EMPTY=Recovery hat keine direkten Fehler erfasst.
RECOV_FULL_LOG=Vollstaendiges Neoloader-Log

RECOVERY_HOME_TITLE=Neoloader Recovery
RECOVERY_HOME_BODY=Dies ist die Recovery-Oberflaeche. Falls du dieses Menue nicht manuell geoeffnet hast, ist bei Neoloader moeglicherweise ein schwerwiegender Fehler waehrend des Ladens aufgetreten. Benutze die Seiten auf der linken Seite, um Logs zu pruefen, geladene Plugins zu aendern oder Recovery-Aktionen auszufuehren, um erkannte Probleme zu beheben.
RECOVERY_HOME_WARN=Aendere nur, was noetig ist. Manche Aenderungen werden moeglicherweise sofort wirksam, waehrend andere erst beim naechsten Laden vollstaendig angewendet werden.
RECOVERY_HOME_OPEN_LME=LME-Manager oeffnen
RECOVERY_HOME_CLOSE=Recovery schliessen
RECOVERY_HOME_OPEN_PLUGINS=Plugin-Steuerung oeffnen
RECOVERY_HOME_OPEN_RESOLUTIONS=Recovery-Werkzeuge oeffnen
RECOVERY_HOME_OPEN_LOGS=Logs anzeigen
RECOVERY_HOME_ACCESS_CONSOLE=Spielkonsole oeffnen

RECOVERY_SUGGEST_FS_FAILURE=Dateisystempruefung fehlgeschlagen. Dein LME-Provider wurde nicht korrekt installiert.
RECOVERY_SUGGEST_NEO_FAILURE=Neoloader ist frueh fehlgeschlagen. Pruefe die Logs fuer weitere Details. Dein LME-Provider wurde moeglicherweise nicht korrekt installiert oder braucht ein Update.
RECOVERY_SUGGEST_LIB_FAILURE=Core-API nicht verfuegbar. Pruefe die Logs fuer weitere Details. Dein LME-Provider wurde moeglicherweise nicht korrekt installiert oder braucht ein Update.
RECOVERY_SUGGEST_LME_FAILURE=Der LME-Provider hat das Laden nicht abgeschlossen. Versuche sichere LME-Einstellungen.
RECOVERY_SUGGEST_VO_FAILURE=Die Spieloberflaeche scheint nicht geoeffnet worden zu sein. Versuche im Reiter fuer die Recovery-Aktionen manuell die Standardoberflaeche des Spiels zu starten.
RECOVERY_SUGGEST_ALL_SUCCESS=Keine kritischen Fehler in deinem LME-Provider erkannt. Falls du diese Oberflaeche nicht selbst geoeffnet hast, ist moeglicherweise ein Nicht-LME-Plugin fehlgeschlagen oder ein nicht kritisches Problem aufgetreten.

RECOVERY_LOGS_TITLE=Recovery-Logs
RECOVERY_LOGS_DESCRIP=Diese Logs koennen helfen festzustellen, welches Plugin oder System waehrend des Ladens fehlgeschlagen ist.
RECOVERY_LOGS_REFRESH=Logs aktualisieren
RECOVERY_LOGS_PAGE=Seite
RECOVERY_LOGS_PREV=Zurueck
RECOVERY_LOGS_NEXT=Weiter
RECOVERY_LOGS_PREAMBLE_RLOG=Recovery-Log
RECOVERY_LOGS_PREAMBLE_RLOG_EMPTY=Recovery-Log ist leer.
RECOVERY_LOGS_LME_LOG=Vollstaendiges Neoloader-Log:

RECOVERY_RESOLVE_NONE=Keine Recovery-Option ausgewaehlt.
RECOVERY_WAITING_FOR_SELECTION=Warte auf Auswahl...
RECOV_SELECT_NEW_RESOLV=Wahle oben eine Recovery-Aktion aus. Sie sind nach Schweregrad sortiert; wenn du nicht sicher bist, wie du den Fehler selbst beheben kannst, wird empfohlen, sie der Reihe nach zu versuchen.

RECOVERY_CONFIG_MENU_PRE_DESCRIP=Lege hier LME-Optionen und Ladezustaende registrierter Plugins fest. Die LME wurde noch nicht geladen, daher werden manche Optionen vielleicht erst beim naechsten Start des Spiels oder nur teilweise in dieser Sitzung wirksam.
RECOVERY_CONFIG_MENU_POST_DESCRIP=Lege hier LME-Optionen und Ladezustaende registrierter Plugins fest. Die LME wurde geladen, wodurch die direkte Verwaltung der Konfiguration moeglich ist.
RECOVERY_PLUGIN_CARD_PRE=Registrierter Plugin-Ladezustand.

RECOVERY_DEV_PLACEHOLDER=Entwicklerwerkzeuge sind noch nicht implementiert.

RECOVERY_NAV_TITLE=Recovery
RECOVERY_NAV_HOME=Start
RECOVERY_NAV_RESOLVE=Aktionen
RECOVERY_NAV_PLUGINS=Plugins
RECOVERY_NAV_LOGS=Logs
RECOVERY_NAV_DEV=Entwicklerwerkzeuge

BINARY_YES=YES
BINARY_NO=NO

launch_mode=Startmodus
allow_bad_api_version=Fehlerhafte API-Version erlauben
default_load_state=Standard-Ladezustand
independent=independent
cooperative=cooperative

reload_TITLE=Spiel neu laden
reload_DESCRIP=Laedt die Spieloberflaeche und Plugins neu. Manchmal kann ein Fehler zufaellig sein und schon durch ein Neuladen des Spiels behoben werden. Dies ist auch die richtige Option, wenn du deine Spieldateien selbst aenderst, um den Fehler zu beheben.

show_console_TITLE=Konsole anzeigen
show_console_DESCRIP=Oeffnet die Spielkonsole fuer Debug-Ausgaben.

vo_if_TITLE=Standardoberflaeche starten
vo_if_DESCRIP=Versucht, die Standardoberflaeche von Vendetta zu starten.

quit_TITLE=Vendetta Online schliessen
quit_DESCRIP=Beendet das Spiel vollstaendig. Empfohlen, wenn du mehrfach neu geladen hast und die Fehler keinen Sinn mehr ergeben.

LME_open_config_TITLE=LME-Verwaltungsoberflaeche oeffnen
LME_open_config_DESCRIP=Wenn deine LME erfolgreich geladen wurde, kannst du Plugins und Einstellungen moeglicherweise direkt verwalten. Recovery bleibt im Hintergrund geoeffnet.

LME_disable_plugins_pre_TITLE=Alle registrierten LME-Plugins deaktivieren
LME_disable_plugins_pre_DESCRIP=Deaktiviert alle Plugins, sodass die LME sie in der naechsten Sitzung nicht laedt.

LME_disable_plugins_post_TITLE=Alle registrierten LME-Plugins deaktivieren
LME_disable_plugins_post_DESCRIP=Deaktiviert alle Plugins, sodass die LME sie in der naechsten Sitzung nicht laedt.

safe_LME_settings_pre_TITLE=Sichere LME-Einstellungen anwenden
safe_LME_settings_pre_DESCRIP=Setzt in dieser Sitzung sichere LME-Einstellungen (bevor die LME geladen wurde)

safe_LME_settings_post_TITLE=Sichere LME-Einstellungen anwenden
safe_LME_settings_post_DESCRIP=Schaltet potenziell problematische Konfigurationseinstellungen in deinem LME-Provider aus. Einige Plugins koennen dadurch deaktiviert werden.

disable_all_plugins_TITLE=Alle Plugins deaktivieren
disable_all_plugins_DESCRIP=Deaktiviert die Faehigkeit des Spiels, Plugins zu laden, und schliesst das Spiel. Beim naechsten Start des Spiels koennen keine Plugins ausgefuehrt werden. Um Plugins wieder zu erlauben, musst du sie im Optionsmenue erneut aktivieren.

uninstall_lme_TITLE=Neoloader deinstallieren
uninstall_lme_DESCRIP=Wenn sich deine LME-Umgebung fehlerhaft verhaelt, entfernt diese Option die Einstellungen und verhindert, dass Neoloader erneut ausgefuehrt wird, bis es wieder installiert wird. Du solltest diese Option auch verwenden, wenn du Neoloader aktualisieren willst und das Standard-Deinstallationsprogramm nicht funktioniert.

nuke_settings_TITLE=Kompletter Reset
nuke_settings_DESCRIP=Entfernt so viele LME-Daten wie moeglich aus deiner config.ini, deaktiviert alle Plugins und setzt bestimmte Spieloptionen auf bekannte sichere Einstellungen zurueck. Wenn das dein Spiel nicht repariert, brauchst du Hilfe, die ein automatisches System nicht leisten kann.

RECOV_STARTUP_MGR_CHECK_DISABLED=Neoloader konnte kein aktiviertes Plugin fuer die LME-Verwaltung finden
RECOV_STARTUP_MGR_CHECK_FAILURE=Neoloader konnte kein Plugin fuer die LME-Verwaltung finden

enable_neomgr_TITLE=Versuche, 'neomgr' zu aktivieren
enable_neomgr_DESCRIP='neomgr' ist ein mit Neoloader gebuendeltes Frontend, scheint aber deaktiviert zu sein. Benutze diese Recovery-Aktion, um zu versuchen, es zu aktivieren.