[recovery]
RECOV_MISSING_CORE_FILES=Neoloader heeft een kritieke fout ondervonden en kan niet starten!\nVereiste bestanden voor Neoloader zijn niet gevonden.\nOntbrekende bestanden:
RECOV_FS_MISSING_MODULE=Neoloader kon een vereiste module niet vinden
RECOV_FS_FAILED_MODULE=Neoloader kon een vereiste module niet laden
RECOV_RUN=Voer deze actie uit
RECOV_RUN_FAIL=Actie mislukt: 
RECOV_USER_ACCESS_NOTIF=Recovery geopend door gebruiker

RECOV_PREAMBLE=Fouten vastgelegd door recovery
RECOV_PREAMBLE_EMPTY=Recovery heeft geen directe fouten vastgelegd.
RECOV_FULL_LOG=Volledig Neoloader-log

RECOVERY_HOME_TITLE=Neoloader Recovery
RECOVERY_HOME_BODY=Dit is de recovery-interface. Als je dit menu niet handmatig hebt geopend, kan Neoloader een kritieke fout hebben ondervonden tijdens het laden. Gebruik de pagina's aan de linkerkant om logs te bekijken, te wijzigen welke plugins geladen worden of recovery-acties uit te voeren om problemen op te lossen.
RECOVERY_HOME_WARN=Wijzig alleen wat nodig is. Sommige wijzigingen worden direct toegepast, andere pas bij de volgende keer laden.
RECOVERY_HOME_OPEN_LME=Open LME-manager
RECOVERY_HOME_CLOSE=Sluit recovery
RECOVERY_HOME_OPEN_PLUGINS=Open plugin-instellingen
RECOVERY_HOME_OPEN_RESOLUTIONS=Open recovery-tools
RECOVERY_HOME_OPEN_LOGS=Bekijk logs
RECOVERY_HOME_ACCESS_CONSOLE=Open spelconsole

RECOVERY_SUGGEST_FS_FAILURE=Bestandssysteemcontrole mislukt. Je LME-provider is mogelijk niet correct geinstalleerd.
RECOVERY_SUGGEST_NEO_FAILURE=Neoloader is vroeg gestopt. Controleer logs voor meer details. Je LME-provider is mogelijk niet correct geinstalleerd of moet worden bijgewerkt.
RECOVERY_SUGGEST_LIB_FAILURE=Core API niet beschikbaar. Controleer logs voor meer details. Je LME-provider is mogelijk niet correct geinstalleerd of moet worden bijgewerkt.
RECOVERY_SUGGEST_LME_FAILURE=De LME-provider is niet volledig geladen. Probeer veilige LME-instellingen.
RECOVERY_SUGGEST_VO_FAILURE=De spelinterface lijkt niet geopend te zijn. Probeer handmatig de standaardinterface van het spel te starten via de recovery-tab.
RECOVERY_SUGGEST_ALL_SUCCESS=Geen kritieke fouten gedetecteerd in je LME-provider. Als je deze interface niet zelf hebt geopend, kan een niet-LME plugin zijn mislukt of is er een niet-kritiek probleem opgetreden.

RECOVERY_LOGS_TITLE=Recovery-logs
RECOVERY_LOGS_DESCRIP=Deze logs kunnen helpen bepalen welke plugin of systeem is mislukt tijdens het laden.
RECOVERY_LOGS_REFRESH=Ververs logs
RECOVERY_LOGS_PAGE=Pagina
RECOVERY_LOGS_PREV=Vorige
RECOVERY_LOGS_NEXT=Volgende
RECOVERY_LOGS_PREAMBLE_RLOG=Recovery-log
RECOVERY_LOGS_PREAMBLE_RLOG_EMPTY=Recovery-log is leeg.
RECOVERY_LOGS_LME_LOG=Volledig Neoloader-log:

RECOVERY_RESOLVE_NONE=Geen recovery-optie geselecteerd.
RECOVERY_WAITING_FOR_SELECTION=Wachten op selectie...
RECOV_SELECT_NEW_RESOLV=Selecteer hierboven een recovery-actie. Ze zijn gerangschikt op ernst; als je niet weet hoe je het probleem moet oplossen, probeer ze dan in volgorde.

RECOVERY_CONFIG_MENU_PRE_DESCRIP=Stel hier LME-opties en laadstatussen van geregistreerde plugins in. LME is nog niet geladen, dus sommige opties werken mogelijk pas bij de volgende sessie of gedeeltelijk.
RECOVERY_CONFIG_MENU_POST_DESCRIP=Stel hier LME-opties en laadstatussen van geregistreerde plugins in. LME is geladen, dus directe configuratie is mogelijk.
RECOVERY_PLUGIN_CARD_PRE=Laadstatus van geregistreerde plugin.

RECOVERY_DEV_PLACEHOLDER=Ontwikkelaarstools zijn nog niet geimplementeerd.

RECOVERY_NAV_TITLE=Recovery
RECOVERY_NAV_HOME=Start
RECOVERY_NAV_RESOLVE=Acties
RECOVERY_NAV_PLUGINS=Plugins
RECOVERY_NAV_LOGS=Logs
RECOVERY_NAV_DEV=Ontwikkelaarstools

BINARY_YES=YES
BINARY_NO=NO

launch_mode=Opstartmodus
allow_bad_api_version=Sta ongeldige API-versie toe
default_load_state=Standaard laadstatus
independent=independent
cooperative=cooperative

reload_TITLE=Herlaad spel
reload_DESCRIP=Herlaadt de spelinterface en plugins. Soms kan een fout tijdelijk zijn en opgelost worden door het spel opnieuw te laden. Gebruik dit ook als je zelf spelbestanden aanpast om een probleem op te lossen.

show_console_TITLE=Toon console
show_console_DESCRIP=Opent de spelconsole voor debug-uitvoer.

vo_if_TITLE=Start standaardinterface
vo_if_DESCRIP=Probeert de standaardinterface van Vendetta te starten.

quit_TITLE=Sluit Vendetta Online
quit_DESCRIP=Sluit het spel volledig. Aanbevolen als meerdere herlaadpogingen geen logische resultaten geven.

LME_open_config_TITLE=Open LME-beheerinterface
LME_open_config_DESCRIP=Als LME succesvol geladen is, kun je plugins en instellingen direct beheren. Recovery blijft op de achtergrond open.

LME_disable_plugins_pre_TITLE=Schakel alle geregistreerde LME-plugins uit
LME_disable_plugins_pre_DESCRIP=Schakelt alle plugins uit zodat LME ze niet laadt bij de volgende sessie.

LME_disable_plugins_post_TITLE=Schakel alle geregistreerde LME-plugins uit
LME_disable_plugins_post_DESCRIP=Schakelt alle plugins uit zodat LME ze niet laadt bij de volgende sessie.

safe_LME_settings_pre_TITLE=Pas veilige LME-instellingen toe
safe_LME_settings_pre_DESCRIP=Stelt veilige LME-instellingen in voor deze sessie (voordat LME geladen is)

safe_LME_settings_post_TITLE=Pas veilige LME-instellingen toe
safe_LME_settings_post_DESCRIP=Schakelt mogelijk problematische instellingen uit in je LME-provider. Sommige plugins kunnen hierdoor uitgeschakeld worden.

disable_all_plugins_TITLE=Schakel alle plugins uit
disable_all_plugins_DESCRIP=Schakelt het laden van plugins uit en sluit het spel. Bij de volgende start worden geen plugins geladen. Om plugins weer te gebruiken, moet je ze opnieuw inschakelen in de instellingen.

uninstall_lme_TITLE=Verwijder Neoloader
uninstall_lme_DESCRIP=Als je LME-omgeving zich vreemd gedraagt, verwijdert deze optie instellingen en voorkomt dat Neoloader wordt uitgevoerd totdat het opnieuw wordt geinstalleerd. Gebruik dit ook bij updates als de standaard verwijdering niet werkt.

nuke_settings_TITLE=Volledige reset
nuke_settings_DESCRIP=Verwijdert zoveel mogelijk LME-gegevens uit config.ini, schakelt alle plugins uit en zet bepaalde spelinstellingen terug naar veilige waarden. Als dit het probleem niet oplost, is handmatige hulp nodig.

RECOV_STARTUP_MGR_CHECK_DISABLED=Neoloader kon geen ingeschakelde plugin vinden voor LME-beheer
RECOV_STARTUP_MGR_CHECK_FAILURE=Neoloader kon geen plugin vinden voor LME-beheer

enable_neomgr_TITLE=Probeer 'neomgr' in te schakelen
enable_neomgr_DESCRIP='neomgr' is een frontend die bij Neoloader wordt geleverd, maar lijkt uitgeschakeld te zijn. Gebruik deze recovery-actie om te proberen het in te schakelen.