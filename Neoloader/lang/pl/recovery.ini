[recovery]
RECOV_MISSING_CORE_FILES=Neoloader napotkal krytyczny blad i nie moze sie uruchomic!\nWymagane pliki do dzialania Neoloadera nie zostaly znalezione.\nBrakujace pliki:
RECOV_FS_MISSING_MODULE=Neoloader nie mogl znalezc wymaganego modulu
RECOV_FS_FAILED_MODULE=Neoloader nie mogl zaladowac wymaganego modulu
RECOV_RUN=Uruchom te akcje
RECOV_RUN_FAIL=Operacja nie powiodla sie: 
RECOV_USER_ACCESS_NOTIF=Recovery otwarte przez uzytkownika

RECOV_PREAMBLE=Bledy wykryte przez recovery
RECOV_PREAMBLE_EMPTY=Recovery nie wykrylo zadnych bezposrednich bledow.
RECOV_FULL_LOG=Pelny log Neoloadera

RECOVERY_HOME_TITLE=Neoloader Recovery
RECOVERY_HOME_BODY=To jest interfejs recovery. Jesli nie otworzyles tego menu recznie, Neoloader mogl napotkac krytyczny blad podczas ladowania. Uzyj paneli po lewej stronie, aby sprawdzic logi, zmienic zaladowane wtyczki lub uruchomic akcje recovery, aby sprobowac naprawic wykryte problemy.
RECOVERY_HOME_WARN=Zmieniaj tylko to, co jest konieczne. Niektore zmiany moga zostac zastosowane natychmiast, inne dopiero przy kolejnym uruchomieniu.
RECOVERY_HOME_OPEN_LME=Otworz menedzer LME
RECOVERY_HOME_CLOSE=Zamknij recovery
RECOVERY_HOME_OPEN_PLUGINS=Otworz kontrolki wtyczek
RECOVERY_HOME_OPEN_RESOLUTIONS=Otworz narzedzia recovery
RECOVERY_HOME_OPEN_LOGS=Zobacz logi
RECOVERY_HOME_ACCESS_CONSOLE=Otworz konsole gry

RECOVERY_SUGGEST_FS_FAILURE=Sprawdzenie systemu plikow nie powiodlo sie. Twoj dostawca LME nie zostal poprawnie zainstalowany.
RECOVERY_SUGGEST_NEO_FAILURE=Neoloader zatrzymal sie bardzo wczesnie. Sprawdz logi po wiecej informacji. Twoj dostawca LME mogl nie zostac poprawnie zainstalowany lub wymaga aktualizacji.
RECOVERY_SUGGEST_LIB_FAILURE=API glowne nie jest dostepne. Sprawdz logi po wiecej informacji. Twoj dostawca LME mogl nie zostac poprawnie zainstalowany lub wymaga aktualizacji.
RECOVERY_SUGGEST_LME_FAILURE=Dostawca LME nie zakonczyl ladowania. Sprobuj bezpiecznych ustawien LME.
RECOVERY_SUGGEST_VO_FAILURE=Interfejs gry prawdopodobnie sie nie otworzyl. Sprobuj recznie uruchomic domyslny interfejs gry z zakladki recovery.
RECOVERY_SUGGEST_ALL_SUCCESS=Nie wykryto krytycznych bledow w twoim dostawcy LME. Jesli nie otworzyles tego interfejsu samodzielnie, mogla wystapic awaria wtyczki spoza LME lub niekrytyczny problem.

RECOVERY_LOGS_TITLE=Logi recovery
RECOVERY_LOGS_DESCRIP=Te logi moga pomoc zidentyfikowac, ktora wtyczka lub system zawiodl podczas ladowania.
RECOVERY_LOGS_REFRESH=Odswiez logi
RECOVERY_LOGS_PAGE=Strona
RECOVERY_LOGS_PREV=Poprz
RECOVERY_LOGS_NEXT=Nast
RECOVERY_LOGS_PREAMBLE_RLOG=Log recovery
RECOVERY_LOGS_PREAMBLE_RLOG_EMPTY=Log recovery jest pusty.
RECOVERY_LOGS_LME_LOG=Pelny log Neoloadera:

RECOVERY_RESOLVE_NONE=Nie wybrano opcji recovery.
RECOVERY_WAITING_FOR_SELECTION=Oczekiwanie na wybor...
RECOV_SELECT_NEW_RESOLV=Wybierz powyzej akcje recovery. Sa uporzadkowane wedlug waznosci; jesli nie wiesz jak naprawic blad, zaleca sie wykonywanie ich po kolei.

RECOVERY_CONFIG_MENU_PRE_DESCRIP=Ustaw tutaj opcje LME i stany ladowania zarejestrowanych wtyczek. LME nie zostalo jeszcze zaladowane, wiec niektore opcje moga zadzialac dopiero przy nastepnym uruchomieniu lub tylko czesciowo w tej sesji.
RECOVERY_CONFIG_MENU_POST_DESCRIP=Ustaw tutaj opcje LME i stany ladowania zarejestrowanych wtyczek. LME zostalo zaladowane, co pozwala na bezposrednie zarzadzanie konfiguracja.
RECOVERY_PLUGIN_CARD_PRE=Stan ladowania zarejestrowanej wtyczki.

RECOVERY_DEV_PLACEHOLDER=Narzedia deweloperskie nie sa jeszcze zaimplementowane.

RECOVERY_NAV_TITLE=Recovery
RECOVERY_NAV_HOME=Start
RECOVERY_NAV_RESOLVE=Akcje
RECOVERY_NAV_PLUGINS=Wtyczki
RECOVERY_NAV_LOGS=Logi
RECOVERY_NAV_DEV=Narzedia deweloperskie

BINARY_YES=YES
BINARY_NO=NO

launch_mode=Tryb uruchamiania
allow_bad_api_version=Zezwol na niepoprawna wersje API
default_load_state=Domyslny stan ladowania
independent=independent
cooperative=cooperative

reload_TITLE=Przeladuj gre
reload_DESCRIP=Przeladowuje interfejs gry i wtyczki. Czasami blad moze byc przypadkowy i zniknie po ponownym zaladowaniu gry. To takze opcja, ktora nalezy wybrac, jesli zmieniasz pliki gry, aby naprawic blad samodzielnie.

show_console_TITLE=Pokaz konsole
show_console_DESCRIP=Otwiera konsole gry do debugowania.

vo_if_TITLE=Uruchom domyslny interfejs
vo_if_DESCRIP=Probuje uruchomic domyslny interfejs Vendetta.

quit_TITLE=Zamknij Vendetta Online
quit_DESCRIP=Zamyka gre calkowicie. Zalecane, jesli wielokrotne przeladowania nie maja sensu.

LME_open_config_TITLE=Otworz interfejs zarzadzania LME
LME_open_config_DESCRIP=Jesli LME zostalo poprawnie zaladowane, mozesz zarzadzac wtyczkami i ustawieniami bezposrednio. Recovery pozostanie otwarte w tle.

LME_disable_plugins_pre_TITLE=Wylacz wszystkie zarejestrowane wtyczki LME
LME_disable_plugins_pre_DESCRIP=Wylacza wszystkie wtyczki, aby LME nie ladowalo ich przy nastepnej sesji.

LME_disable_plugins_post_TITLE=Wylacz wszystkie zarejestrowane wtyczki LME
LME_disable_plugins_post_DESCRIP=Wylacza wszystkie wtyczki, aby LME nie ladowalo ich przy nastepnej sesji.

safe_LME_settings_pre_TITLE=Zastosuj bezpieczne ustawienia LME
safe_LME_settings_pre_DESCRIP=Ustawia bezpieczne ustawienia LME w tej sesji (przed zaladowaniem LME)

safe_LME_settings_post_TITLE=Zastosuj bezpieczne ustawienia LME
safe_LME_settings_post_DESCRIP=Wylacza potencjalnie problematyczne ustawienia konfiguracji LME. Niektore wtyczki moga zostac w wyniku tego wylaczone.

disable_all_plugins_TITLE=Wylacz wszystkie wtyczki
disable_all_plugins_DESCRIP=Wylacza mozliwosc ladowania wtyczek przez gre i zamyka ja. Przy nastepnym uruchomieniu zadne wtyczki nie beda mogly zostac uruchomione. Aby ponownie wlaczyc wtyczki, nalezy je aktywowac w ustawieniach.

uninstall_lme_TITLE=Odinstaluj Neoloader
uninstall_lme_DESCRIP=Jesli twoje srodowisko LME dziala niepoprawnie, ta opcja usunie ustawienia i zablokuje uruchamianie Neoloadera do czasu ponownej instalacji. Uzyj jej rowniez, jesli chcesz zaktualizowac Neoloader i standardowy deinstalator nie dziala.

nuke_settings_TITLE=Pelny reset
nuke_settings_DESCRIP=Usuwa jak najwiecej danych LME z config.ini, wylacza wszystkie wtyczki i przywraca niektore ustawienia gry do bezpiecznych wartosci. Jesli to nie rozwiaze problemu, potrzebna bedzie pomoc poza systemem automatycznym.

RECOV_STARTUP_MGR_CHECK_DISABLED=Neoloader nie znalazl wlaczonej wtyczki do zarzadzania LME
RECOV_STARTUP_MGR_CHECK_FAILURE=Neoloader nie znalazl zadnej wtyczki do zarzadzania LME

enable_neomgr_TITLE=Proba wlaczenia 'neomgr'
enable_neomgr_DESCRIP='neomgr' to frontend dolaczony do Neoloadera, ale wydaje sie byc wylaczony. Uzyj tej akcji recovery, aby sprobowac go wlaczyc.