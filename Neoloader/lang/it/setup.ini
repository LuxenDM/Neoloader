[setup]
LOCALE_SELECT=Seleziona la tua lingua.
MAINGREET=Neoloader e in esecuzione per la prima volta oppure e stato aggiornato di recente. Questa configurazione ti aiutera a impostarne il comportamento.
DESCRIPAUTH=Alcune impostazioni richiedono la tua approvazione prima di poter essere modificate. Questo impedisce ai plugin di modificare comportamenti importanti senza il tuo permesso.
usedef=Usa solo le opzioni predefinite
SELECTCFGLEVEL=Quanta configurazione vuoi effettuare?
cfgstandard=Mostra le opzioni di configurazione standard
cfgadvanced=Mostra opzioni aggiuntive per gli sviluppatori di plugin
LANG_NOT_GAME_SUPPORTED=Non supportato dal gioco base
LANGUAGE_SUPPORT_NOTE=La lingua che hai selezionato non e supportata dal gioco. Neoloader mostrera testo localizzato, ma il gioco rimarra nella tua lingua attuale.

default_load_state_name=Stato di caricamento predefinito
default_load_state_descrip=Consente ai plugin di caricarsi automaticamente quando vengono registrati. NO significa che dovranno essere abilitati manualmente.

launch_mode_name=Modalita operativa di Neoloader
launch_mode_descrip=Scegli come si avvia Neoloader. La modalita independent avvia Neoloader direttamente. La modalita cooperative usa il normale loader di plugin del gioco, ma alcuni vecchi plugin LME potrebbero non funzionare.
launch_mode_option_indp=independent
launch_mode_option_coop=cooperative

register_voidif_name=Registra VoidIF
register_voidif_descrip=VoidIF serve solo per configurazioni avanzate insolite dell'interfaccia. Lascialo disattivato a meno che tu non sappia gia di averne bisogno.
register_voidif_addonly=Solo registra

override_disabled_plugin_state_name=Esegui Neoloader anche quando i plugin sono disabilitati
override_disabled_plugin_state_descrip=In modalita independent, Neoloader rispetta l'impostazione di gioco che disabilita il loader dei plugin e ne interrompe l'esecuzione. Imposta questo su YES per ignorare tale impostazione ed eseguire comunque Neoloader.

stat_graphing_name=Abilita registrazione periodica delle prestazioni
stat_graphing_descrip=Registra periodicamente informazioni sulle prestazioni e le scrive nel log per il debug.

FINISH_SCREEN_MSG=Le opzioni sono state configurate; grazie per aver usato Neoloader!
FINISH_SCREEN_DISCORD_INV=Per assistenza con Neoloader o con i plugin in generale, visita la Vendetta Online Modding Community!
DISCORD_JOIN=Fai clic per entrare
FINISH_REMINDER_MSG=Puoi eseguire di nuovo la configurazione con '/neosetup', oppure aprire il manager con '/neo'.
