[metadata]
description=locale translations for the recovery system (Italian)
owner=Neoloader|7.0.0
type=ini
created=2026-04-09
ini-meta=non-serial data|translation tables

[recovery]
RECOV_MISSING_CORE_FILES=Neoloader ha riscontrato un errore critico e non puo avviarsi!\nI file richiesti per il funzionamento di Neoloader non sono stati trovati.\nFile mancanti:
RECOV_FS_MISSING_MODULE=Neoloader non e riuscito a trovare un modulo richiesto
RECOV_FS_FAILED_MODULE=Neoloader non e riuscito a caricare un modulo richiesto
RECOV_RUN=Esegui questa azione
RECOV_RUN_FAIL=Operazione non riuscita: 
RECOV_USER_ACCESS_NOTIF=Recovery aperto dall'utente

RECOV_PREAMBLE=Errori rilevati dal recovery
RECOV_PREAMBLE_EMPTY=Il recovery non ha rilevato errori diretti.
RECOV_FULL_LOG=Log completo di Neoloader

RECOVERY_HOME_TITLE=Neoloader Recovery
RECOVERY_HOME_BODY=Questa e l'interfaccia di recovery. A meno che tu non abbia aperto manualmente questo menu, Neoloader potrebbe aver riscontrato un errore catastrofico durante il caricamento. Usa le pagine sulla sinistra per controllare i log, modificare quali plugin vengono caricati o eseguire azioni di recovery per tentare di risolvere i problemi rilevati.
RECOVERY_HOME_WARN=Modifica solo cio che e necessario. Alcune modifiche potrebbero essere applicate immediatamente, mentre altre potrebbero richiedere il prossimo caricamento per avere pieno effetto.
RECOVERY_HOME_OPEN_LME=Apri gestore LME
RECOVERY_HOME_CLOSE=Chiudi recovery
RECOVERY_HOME_OPEN_PLUGINS=Apri controlli plugin
RECOVERY_HOME_OPEN_RESOLUTIONS=Apri strumenti di recovery
RECOVERY_HOME_OPEN_LOGS=Visualizza log
RECOVERY_HOME_ACCESS_CONSOLE=Apri console di gioco

RECOVERY_SUGGEST_FS_FAILURE=Il controllo del filesystem non e riuscito. Il tuo provider LME non e stato installato correttamente.
RECOVERY_SUGGEST_NEO_FAILURE=Neoloader si e interrotto presto. Controlla i log per maggiori dettagli. Il tuo provider LME potrebbe non essere stato installato correttamente o potrebbe richiedere un aggiornamento.
RECOVERY_SUGGEST_LIB_FAILURE=API principale non disponibile. Controlla i log per maggiori dettagli. Il tuo provider LME potrebbe non essere stato installato correttamente o potrebbe richiedere un aggiornamento.
RECOVERY_SUGGEST_LME_FAILURE=Il provider LME non ha completato il caricamento. Prova impostazioni LME sicure.
RECOVERY_SUGGEST_VO_FAILURE=L'interfaccia di gioco sembra non essersi aperta. Prova ad avviare manualmente l'interfaccia predefinita del gioco dalla scheda delle azioni di recovery.
RECOVERY_SUGGEST_ALL_SUCCESS=Nessun errore critico rilevato nel tuo provider LME. Se non hai aperto tu questa interfaccia, potrebbe essersi verificato un errore in un plugin non LME o un problema non critico.

RECOVERY_LOGS_TITLE=Log di recovery
RECOVERY_LOGS_DESCRIP=Questi log possono aiutare a identificare quale plugin o sistema ha fallito durante il caricamento.
RECOVERY_LOGS_REFRESH=Aggiorna log
RECOVERY_LOGS_PAGE=Pagina
RECOVERY_LOGS_PREV=Prec
RECOVERY_LOGS_NEXT=Succ
RECOVERY_LOGS_PREAMBLE_RLOG=Log di recovery
RECOVERY_LOGS_PREAMBLE_RLOG_EMPTY=Il log di recovery e vuoto.
RECOVERY_LOGS_LME_LOG=Log completo di Neoloader:

RECOVERY_RESOLVE_NONE=Nessuna opzione di recovery selezionata.
RECOVERY_WAITING_FOR_SELECTION=In attesa di selezione...
RECOV_SELECT_NEW_RESOLV=Seleziona sopra un'azione di recovery. Sono elencate in ordine di gravita; se non sai come correggere il problema da solo, si consiglia di provarle in ordine.

RECOVERY_CONFIG_MENU_PRE_DESCRIP=Imposta qui le opzioni LME e gli stati di caricamento dei plugin registrati. L'LME non e ancora stato caricato, quindi alcune opzioni potrebbero avere effetto solo al prossimo avvio del gioco o applicarsi solo parzialmente in questa sessione.
RECOVERY_CONFIG_MENU_POST_DESCRIP=Imposta qui le opzioni LME e gli stati di caricamento dei plugin registrati. L'LME e stato caricato, consentendo la gestione diretta della configurazione.
RECOVERY_PLUGIN_CARD_PRE=Stato di caricamento del plugin registrato.

RECOVERY_DEV_PLACEHOLDER=Gli strumenti per sviluppatori non sono ancora implementati.

RECOVERY_NAV_TITLE=Recovery
RECOVERY_NAV_HOME=Home
RECOVERY_NAV_RESOLVE=Azioni
RECOVERY_NAV_PLUGINS=Plugin
RECOVERY_NAV_LOGS=Log
RECOVERY_NAV_DEV=Strumenti sviluppatore

BINARY_YES=YES
BINARY_NO=NO

launch_mode=Modalita di avvio
allow_bad_api_version=Consenti versione API non valida
default_load_state=Stato di caricamento predefinito
independent=independent
cooperative=cooperative

reload_TITLE=Ricarica gioco
reload_DESCRIP=Ricarica l'interfaccia di gioco e i plugin. A volte un errore puo essere casuale e risolversi semplicemente ricaricando il gioco. Questa e anche l'opzione da selezionare se modifichi i file di gioco per correggere il problema da solo.

show_console_TITLE=Mostra console
show_console_DESCRIP=Apre la console di gioco per l'output di debug.

vo_if_TITLE=Avvia interfaccia predefinita
vo_if_DESCRIP=Tenta di avviare l'interfaccia predefinita di Vendetta.

quit_TITLE=Chiudi Vendetta Online
quit_DESCRIP=Chiude completamente il gioco. Consigliato se hai effettuato piu ricaricamenti e gli errori sembrano insensati.

LME_open_config_TITLE=Apri interfaccia di gestione LME
LME_open_config_DESCRIP=Se il tuo LME e stato caricato correttamente, potresti essere in grado di gestire direttamente plugin e impostazioni. Il recovery restera aperto in background.

LME_disable_plugins_pre_TITLE=Disabilita tutti i plugin LME registrati
LME_disable_plugins_pre_DESCRIP=Disabilita tutti i plugin in modo che l'LME non li carichi nella prossima sessione.

LME_disable_plugins_post_TITLE=Disabilita tutti i plugin LME registrati
LME_disable_plugins_post_DESCRIP=Disabilita tutti i plugin in modo che l'LME non li carichi nella prossima sessione.

safe_LME_settings_pre_TITLE=Applica impostazioni LME sicure
safe_LME_settings_pre_DESCRIP=Imposta impostazioni LME sicure in questa sessione (prima che l'LME sia stato caricato)

safe_LME_settings_post_TITLE=Applica impostazioni LME sicure
safe_LME_settings_post_DESCRIP=Disattiva le impostazioni di configurazione potenzialmente problematiche nel tuo provider LME. Di conseguenza alcuni plugin potrebbero essere disabilitati.

disable_all_plugins_TITLE=Disabilita tutti i plugin
disable_all_plugins_DESCRIP=Disattiva la capacita del gioco di caricare plugin e chiude il gioco. Al prossimo avvio del gioco nessun plugin potra essere eseguito. Per consentire nuovamente l'esecuzione dei plugin, dovrai riabilitarli dal menu opzioni.

uninstall_lme_TITLE=Disinstalla Neoloader
uninstall_lme_DESCRIP=Se il tuo ambiente LME si comporta in modo anomalo, questa opzione rimuovera le impostazioni e impedira a Neoloader di essere eseguito finche non verra installato di nuovo. Dovresti usare questa opzione anche se vuoi aggiornare Neoloader e il disinstallatore standard non funziona.

nuke_settings_TITLE=Reset totale
nuke_settings_DESCRIP=Rimuove quanti piu dati LME possibile dal tuo config.ini, disabilita tutti i plugin e reimposta alcune opzioni di gioco a valori noti come sicuri. Se questo non risolve il problema del gioco, allora hai bisogno di aiuto che un sistema automatico non puo fornire.

RECOV_STARTUP_MGR_CHECK_DISABLED=Neoloader non e riuscito a trovare un plugin abilitato per la gestione LME
RECOV_STARTUP_MGR_CHECK_FAILURE=Neoloader non e riuscito a trovare alcun plugin per la gestione LME

enable_neomgr_TITLE=Prova ad abilitare 'neomgr'
enable_neomgr_DESCRIP='neomgr' e un frontend incluso con Neoloader, ma sembra essere disabilitato. Usa questa azione di recovery per tentare di abilitarlo.