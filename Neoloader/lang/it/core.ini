[recovery]
RECOVERY_FAILSAFE=Neoloader ha riscontrato un errore critico e non verra caricato. Il sistema failsafe e stato attivato e ora verra caricata l'interfaccia predefinita. Errore riportato
RECOVERY_CONFIRM=Okay
DIR_FIND_FAIL=local_dir_find_failure: Impossibile determinare la directory home con i metodi disponibili.
RECOVERY_NOT_FOUND=Il sistema di recovery non e stato trovato. Percorso previsto:
RECOVERY_NOT_FOUND_PCHECK= pathlock era 
RECOVERY_LOAD_ERROR=Impossibile caricare il sistema di recovery. Errore:
RECOVERY_EXEC_ERROR=Impossibile avviare il sistema di recovery. Errore:
MISSING_RECOVERY_2=Il controllo recovery e riuscito, ma il sistema di recovery non era pronto quando il controllo di un file principale e fallito.
RECOV_STARTUP_MGR_CHECK_DISABLED=Neoloader non ha trovato un plugin abilitato per la gestione LME. E stata aggiunta un'opzione di recovery per tentare di abilitare neomgr.
RECOV_STARTUP_MGR_CHECK_FAILURE=Neoloader non ha trovato alcun plugin per la gestione LME.

[AUTH]
GRANT_AUTH=Concedi accesso
DENY_AUTH=Nega accesso
REQUEST_AUTH=sta richiedendo il permesso di gestione per Neoloader

[main]
STOP_PRINT=Neoloader ha avuto un errore catastrofico l'ultima volta che e stato eseguito e l'esecuzione successiva e stata interrotta. Il codice STOP riportato era
STOP_PRINT_2=Per rimuovere questo messaggio e reinizializzare Neoloader, usa il comando /neo.
REM_PRINT=Neoloader è disattivato. Per riattivarlo e configurarlo nuovamente, esegui il comando /neo. Se non ti serve più, puoi eliminare in sicurezza la cartella del plugin Neoloader quando preferisci.