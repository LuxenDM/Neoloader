[recovery]
RECOVERY_FAILSAFE=Neoloader encontrou um erro critico e nao sera carregado. O sistema de seguranca foi ativado e a interface padrao sera carregada. Erro indicado
RECOVERY_CONFIRM=OK
DIR_FIND_FAIL=local_dir_find_failure: Nao foi possivel determinar o diretorio base com os metodos disponiveis.
RECOVERY_NOT_FOUND=Sistema de recovery nao encontrado. Caminho esperado:
RECOVERY_NOT_FOUND_PCHECK= pathlock era 
RECOVERY_LOAD_ERROR=Falha ao carregar o sistema de recovery. Erro:
RECOVERY_EXEC_ERROR=Falha ao iniciar o sistema de recovery. Erro:
MISSING_RECOVERY_2=Verificacao de recovery passou, mas o sistema nao estava pronto quando um arquivo central falhou.
RECOV_STARTUP_MGR_CHECK_DISABLED=Neoloader nao encontrou um plugin ativado para a gestao do LME. Uma opcao de recovery foi adicionada para tentar ativar o neomgr.
RECOV_STARTUP_MGR_CHECK_FAILURE=Neoloader nao encontrou nenhum plugin para a gestao do LME.

[AUTH]
GRANT_AUTH=Permitir acesso
DENY_AUTH=Negar acesso
REQUEST_AUTH=solicita permissao de gerenciamento do Neoloader

[main]
STOP_PRINT=Neoloader teve um erro critico na ultima execucao e foi interrompido. O codigo STOP informado foi
STOP_PRINT_2=Para remover esta mensagem e reiniciar o Neoloader, use o comando /neo.
REM_PRINT=O Neoloader está desativado. Para ativá-lo e configurá-lo novamente, execute o comando /neo. Caso não precise mais dele, você pode excluir a pasta do plugin Neoloader quando for conveniente.