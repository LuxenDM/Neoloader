NAV_PREV=Voltar
NAV_NEXT=Proximo
CLOSE_WINDOW=Fechar

LOCALE_SELECT=Selecione seu idioma.
MAINGREET=Neoloader esta sendo executado pela primeira vez ou foi atualizado recentemente. Esta configuracao vai ajudar voce a escolher como ele funciona.
DESCRIPAUTH=Algumas opcoes precisam da sua aprovacao antes de mudar. Isso impede que plugins alterem funcoes importantes sem sua permissao.
usedef=Usar opcoes padrao
SELECTCFGLEVEL=Quanta configuracao voce quer revisar?
cfgstandard=Mostrar opcoes de configuracao padrao
cfgadvanced=Mostrar opcoes adicionais para desenvolvedores de plugins
LANG_NOT_GAME_SUPPORTED=Nao suportado pelo jogo base
LANGUAGE_SUPPORT_NOTE=O idioma que voce selecionou nao e suportado pelo jogo. O Neoloader exibira texto localizado, mas o jogo permanecera no seu idioma atual.

default_load_state_name=Estado de carga padrao
default_load_state_descrip=Permite que plugins sejam carregados automaticamente ao serem registrados. NAO significa que eles precisam ser ativados manualmente.

launch_mode_name=Modo de funcionamento do Neoloader
launch_mode_descrip=Escolha como o Neoloader inicia. O modo independente executa o Neoloader diretamente. O modo cooperativo usa o carregador normal do jogo, mas alguns plugins LME antigos podem nao funcionar.
launch_mode_option_indp=independente
launch_mode_option_coop=cooperativo

register_voidif_name=Registrar VoidIF
register_voidif_descrip=VoidIF e apenas para configuracoes avancadas e incomuns de interface. Deixe isso desativado, a menos que voce ja saiba que precisa dele.
register_voidif_addonly=Apenas registrar

override_disabled_plugin_state_name=Executar Neoloader mesmo com plugins desativados
override_disabled_plugin_state_descrip=No modo independente, o Neoloader respeita a opcao do jogo que desativa o carregador de plugins e para de executar. Coloque isso em SIM para ignorar essa opcao e executar o Neoloader mesmo assim.

stat_graphing_name=Ativar registro periodico de desempenho
stat_graphing_descrip=Registra periodicamente informacoes de desempenho e escreve isso no log para depuracao.

FINISH_SCREEN_MSG=As opcoes foram configuradas. Obrigado por usar Neoloader!
FINISH_SCREEN_DISCORD_INV=Se voce precisar de ajuda com o Neoloader ou com plugins em geral, visite a comunidade de modding de Vendetta Online!
DISCORD_JOIN=Clique para entrar
FINISH_REMINDER_MSG=Voce pode executar esta configuracao novamente com '/neosetup', ou abrir o gerenciador com '/neo'.
SETUP_BANNER_TEXT=Configuracao do Neoloader

lang_current_notice=Idioma atualmente selecionado
lang_select_completion_prompt=Depois de selecionar o idioma acima, clique em «Seguinte» para continuar.

