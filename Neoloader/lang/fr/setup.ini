override_disabled_plugin_state_descrip=En mode independant, Neoloader respecte l'option du jeu qui desactive le chargeur de plugins et s'arrete. Mettez cette option sur OUI pour ignorer ce reglage et lancer Neoloader quand meme.

stat_graphing_name=Activer l'enregistrement periodique des performances
stat_graphing_descrip=Enregistre periodiquement des informations de performance et les ecrit dans le journal pour le debogage.

