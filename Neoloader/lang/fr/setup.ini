launch_mode_option_coop=cooperatif

register_voidif_name=Enregistrer VoidIF
register_voidif_descrip=VoidIF sert uniquement a des configurations d'interface avancees et peu courantes. Laissez cette option desactivee sauf si vous savez deja que vous en avez besoin.
register_voidif_addonly=Enregistrer seulement

