launch_mode_name=Mode de fonctionnement de Neoloader
launch_mode_descrip=Choisissez comment Neoloader demarre. Le mode independant lance Neoloader directement. Le mode cooperatif utilise le chargeur normal du jeu, mais certains anciens plugins LME peuvent ne pas fonctionner.
