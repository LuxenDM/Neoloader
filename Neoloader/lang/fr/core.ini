[recovery]
RECOVERY_FAILSAFE=Neoloader a rencontre une erreur critique et ne se lancera pas. Le systeme de secours est active et l'interface par defaut va etre chargee. Erreur indiquee
RECOVERY_CONFIRM=OK
DIR_FIND_FAIL=local_dir_find_failure: Impossible de determiner le dossier de base avec les methodes disponibles.
RECOVERY_NOT_FOUND=Le systeme de recovery est introuvable. Chemin attendu:
RECOVERY_NOT_FOUND_PCHECK= pathlock etait 
RECOVERY_LOAD_ERROR=Impossible de charger le systeme de recovery. Erreur:
RECOVERY_EXEC_ERROR=Impossible de lancer le systeme de recovery. Erreur:
MISSING_RECOVERY_2=Verification de recovery reussie, mais le systeme n'etait pas pret lors d'une erreur critique.
RECOV_STARTUP_MGR_CHECK_DISABLED=Neoloader n'a pas trouve de plugin actif pour la gestion du LME. Une option de recovery a ete ajoutee pour essayer d'activer neomgr.
RECOV_STARTUP_MGR_CHECK_FAILURE=Neoloader n'a trouve aucun plugin pour la gestion du LME.

[AUTH]
GRANT_AUTH=Autoriser
DENY_AUTH=Refuser
REQUEST_AUTH=demande l'autorisation de gestion de Neoloader

[main]
STOP_PRINT=Neoloader a rencontre une erreur critique lors de la derniere execution et a ete arrete. Le code STOP indique etait
STOP_PRINT_2=Pour supprimer ce message et relancer Neoloader, utilisez la commande /neo.
REM_PRINT=Neoloader est désactivé. Pour le réactiver et le configurer à nouveau, exécutez la commande /neo. Si vous n'en avez plus besoin, vous pouvez supprimer le dossier du plugin Neoloader en toute sécurité à tout moment.